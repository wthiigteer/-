<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>금쪽같은 내 오가노이드</title>
<style>
:root{
  --ink:#2b2d42;
  --yellow:#ffd93d;
  --pink:#ff5c8a;
  --sky:#4d96ff;
  --mint:#3ec97a;
  --red:#ff4d4d;
  --cream:#fff8e7;
  --bg:#ffeef4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color:var(--ink);
  background-color:var(--bg);
  background-image:radial-gradient(rgba(255,92,138,.18) 2px,transparent 2.5px),radial-gradient(rgba(77,150,255,.14) 2px,transparent 2.5px);
  background-size:28px 28px;
  background-position:0 0,14px 14px;
  min-height:100vh;min-height:100dvh;
  word-break:keep-all;overflow-wrap:break-word;
}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px}
.enter{animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px) rotate(-1deg)}30%{transform:translateX(9px) rotate(1deg)}45%{transform:translateX(-7px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* 공통 */
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:18px}
.btn{display:block;width:100%;padding:16px 14px;font:inherit;font-size:1.1rem;font-weight:900;color:#fff;background:var(--pink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.blue{background:var(--sky)}
.btn.mint{background:var(--mint)}
.btn.ghost{background:#fff;color:var(--ink);font-size:.95rem;padding:11px}
.sub{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:6px 12px;font-weight:900;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg);line-height:1.4}
.sub.pink{background:var(--pink);color:#fff;transform:rotate(1.5deg)}
.sub.sky{background:var(--sky);color:#fff}
.sub.big{font-size:1.25rem;padding:10px 14px}
.steplabel{align-self:flex-start;background:var(--ink);color:var(--yellow);font-weight:900;font-size:.85rem;padding:5px 12px;border-radius:999px;letter-spacing:.5px}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:3px 3px 0 var(--ink)}
.hud .tag{font-weight:900;font-size:.9rem;white-space:nowrap}
.dots{display:flex;gap:4px}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.7rem;font-weight:900;background:#eee;color:#999}
.dots i.done{background:var(--mint);color:#fff}
.dots i.now{background:var(--yellow);color:var(--ink);transform:scale(1.15)}
.score{font-weight:900;white-space:nowrap;display:inline-block}
.score.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5);color:var(--pink)}100%{transform:scale(1)}}

/* 시작 화면 */
.start{justify-content:center;text-align:center;gap:18px}
.logo-small{font-weight:900;font-size:1.3rem;letter-spacing:2px}
.logo-big{font-size:clamp(2.4rem,12vw,3.4rem);font-weight:900;line-height:1.05;color:var(--yellow);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--pink),7px 7px 0 var(--ink);transform:rotate(-3deg);margin:4px 0 10px}
.mascot{position:relative;width:150px;height:150px;margin:0 auto}
.mascot .org{width:100%;height:100%}
.mascot .face{font-size:64px}
.desc{font-size:1rem;line-height:1.6}
.desc small{display:block;margin-top:6px;color:#666;font-size:.85rem}
.name-input{width:100%;padding:14px;font:inherit;font-size:1.05rem;font-weight:700;text-align:center;border:3px solid var(--ink);border-radius:14px;outline:none;background:#fff}
.name-input:focus{box-shadow:0 0 0 4px rgba(255,92,138,.35)}
.meta{font-size:.85rem;color:#555}

/* 사연 접수 */
.case-title{text-align:center;margin:4px 0}
.parent{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:none;width:58px;height:58px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:32px}
.bubble{position:relative;flex:1;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px 16px;box-shadow:4px 4px 0 var(--ink)}
.bubble::before{content:"";position:absolute;left:-14px;top:18px;border:8px solid transparent;border-right:12px solid var(--ink)}
.bubble p{font-size:1.05rem;font-weight:700;line-height:1.55;opacity:0;animation:enter .4s ease forwards}
.who{font-size:.85rem;color:#666;margin-left:68px;margin-top:-6px}
.onair{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:.75rem;padding:3px 8px;border-radius:6px;margin-bottom:6px;animation:blink 1s infinite}

/* 현미경 */
.scope-wrap{position:relative;width:min(76vw,290px);margin:6px auto 0}
.scope{position:relative;width:100%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;border:12px solid #3a3d52;outline:3px solid var(--ink);background:radial-gradient(circle,#fffdf3 0,#f6edd2 70%,#e5d7ae 100%);box-shadow:0 6px 0 var(--ink)}
.scope::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 40px rgba(0,0,0,.35);pointer-events:none}
.grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent calc(50% - 1px),rgba(0,0,0,.1) 50%,transparent calc(50% + 1px)),linear-gradient(90deg,transparent calc(50% - 1px),rgba(0,0,0,.1) 50%,transparent calc(50% + 1px))}
.rec{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;font-weight:900;font-size:.75rem;padding:3px 8px;border-radius:8px;border:2px solid var(--ink);animation:blink 1.2s infinite}
.mag{position:absolute;bottom:-2px;right:-4px;background:#fff;font-weight:900;font-size:.75rem;padding:3px 8px;border-radius:8px;border:2px solid var(--ink)}
@keyframes blink{50%{opacity:.35}}

.org{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#ffe7ef 0,#ffa3c0 55%,#e8648f 100%);
  box-shadow:inset -6px -8px 0 rgba(0,0,0,.08),0 0 0 3px rgba(232,100,143,.3)}
.face{font-size:clamp(28px,9vw,42px);line-height:1;transition:transform .3s}
.face.change{animation:pop .5s}

/* 1. 납작 */
.org.flat{height:15%;width:80%;border-radius:50%;animation:spread 2.4s ease-in-out infinite alternate}
.org.flat .face{font-size:22px}
@keyframes spread{from{width:58%}to{width:90%}}
.flatcell{position:absolute;width:16%;height:6%;border-radius:50%;background:#ffb3c9;border:2px solid #e8648f;opacity:.75}

/* 2. 정체성 혼란 */
.org.wrong{background:conic-gradient(from 20deg,#b8f2a1,#c9a7ff,#ffd59e,#9ad7ff,#b8f2a1);border-radius:42% 58% 63% 37%/45% 40% 60% 55%;animation:morph 3s ease-in-out infinite alternate}
@keyframes morph{0%{border-radius:42% 58% 63% 37%/45% 40% 60% 55%}100%{border-radius:60% 40% 35% 65%/55% 62% 38% 45%}}
.float{position:absolute;font-size:clamp(15px,4.6vw,20px);font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:1px 6px;animation:bob 1.8s ease-in-out infinite}
.float.f1{left:10%;top:16%}.float.f2{right:9%;top:22%;animation-delay:.4s}.float.f3{left:12%;bottom:18%;animation-delay:.8s}.float.f4{right:12%;bottom:15%;animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}

/* 3. 괴사 */
.org.necro{width:66%;height:66%;background:radial-gradient(circle,#161616 0 20%,#4a2626 30%,#b8607a 46%,#ff9fbc 66%,#ffc6d7 100%)}
.ray{position:absolute;inset:0;transform:rotate(var(--a));pointer-events:none}
.ray i{position:absolute;top:calc(50% - 5px);left:95%;width:10px;height:10px;border-radius:50%;background:var(--sky);box-shadow:0 0 6px var(--sky);animation:diffuse 2.4s linear infinite;animation-delay:var(--d)}
@keyframes diffuse{0%{left:95%;opacity:1}65%{opacity:.9}100%{left:67%;opacity:0}}
.o2tag{position:absolute;top:8%;left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:900;color:var(--sky);background:#fff;border-radius:8px;padding:1px 6px;border:2px solid var(--sky)}

/* 4. 오염 */
.scope.contam{background:radial-gradient(circle,#fbf3c4 0,#efe08f 70%,#d8c46a 100%)}
.scope.contam .org{filter:blur(2.5px);opacity:.55}
.fog{position:absolute;inset:-10%;background:radial-gradient(circle at 30% 40%,rgba(235,232,215,.85),transparent 45%),radial-gradient(circle at 70% 60%,rgba(225,222,205,.85),transparent 50%),radial-gradient(circle at 50% 50%,rgba(240,238,225,.55),transparent 70%);animation:fog 5s ease-in-out infinite alternate}
@keyframes fog{to{transform:translate(6%,-4%) scale(1.08)}}
.mic{position:absolute;font-size:clamp(16px,5vw,22px);animation:wiggle 1.1s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(4px,-3px) rotate(15deg)}66%{transform:translate(-3px,3px) rotate(-12deg)}}
.hypha{position:absolute;width:18%;height:18%;border-radius:50%;border:2px dashed rgba(110,110,110,.7);background:radial-gradient(circle,rgba(150,150,150,.5),transparent 70%)}

/* 5. 제각각 */
.org.u{animation:none}
.org.u .face,.org.many .face{font-size:clamp(14px,4.5vw,20px)}

/* 건강 */
.org.healthy{border-radius:46% 54% 50% 50%/52% 48% 52% 48%;animation:bounce 1.6s ease-in-out infinite;
  background:radial-gradient(circle at 35% 30%,#fff0f5 0,#ffb1c9 50%,#f2799f 100%)}
.org.healthy::before,.org.healthy::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0f5,#ffa3c0 70%);border:2px solid rgba(232,100,143,.4)}
.org.healthy::before{top:-12%;left:20%}
.org.healthy::after{bottom:-10%;right:12%}
.org.healthy.many::before,.org.healthy.many::after{width:26%;height:26%}
@keyframes bounce{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-56%) scale(1.05)}}
.spk{position:absolute;font-size:clamp(14px,4.5vw,20px);animation:twinkle 1.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}

.caps{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px}
.note{background:var(--cream);border:2px dashed var(--ink);border-radius:14px;padding:12px 14px;font-size:.98rem;line-height:1.55}

/* 문제 */
.mini{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px}
.mini-org{position:relative;width:46px;height:46px;flex:none}
.mini-org .org{width:100%;height:100%}
.mini-org .face{font-size:26px}
.mini b{font-size:.85rem}
.mini span{font-size:.85rem;color:#555}
.question{font-size:1.15rem;font-weight:900;line-height:1.45;background:#fff;border:3px solid var(--ink);border-left:10px solid var(--pink);border-radius:14px;padding:12px 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;font:inherit;font-size:1rem;font-weight:700;line-height:1.4;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,background .2s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900}
.opt:disabled{cursor:default}
.opt.wrong{background:#ffe1e1;color:#a33;box-shadow:0 2px 0 #a33;border-color:#a33;opacity:.8}
.opt.wrong b{background:var(--red);color:#fff;border-color:#a33}
.opt.right{background:#dcf8e6;border-color:#1f8a4c;box-shadow:0 4px 0 #1f8a4c;animation:pop .5s}
.opt.right b{background:var(--mint);color:#fff}
.opt.dim{opacity:.45}
.fb{border:3px solid var(--ink);border-radius:16px;padding:14px;line-height:1.55;font-size:.98rem;animation:enter .35s ease both}
.fb.bad{background:#fff0f0;border-color:var(--red)}
.fb.good{background:#effcf4;border-color:var(--mint)}
.fb h3{font-size:1.15rem;margin-bottom:4px}
.fb .btn{margin-top:12px}

/* 솔루션 후 */
.quote{position:relative;text-align:center;background:var(--ink);color:#fff;border-radius:18px;padding:18px 14px;font-size:1.15rem;font-weight:900;line-height:1.55;box-shadow:5px 5px 0 var(--pink)}
.quote em{font-style:normal;color:var(--yellow)}
.quote::before{content:"🎙️ 명대사";position:absolute;top:-12px;left:14px;background:var(--yellow);color:var(--ink);font-size:.75rem;padding:2px 10px;border-radius:999px;border:2px solid var(--ink)}
.concept{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px;line-height:1.6}
.concept h4{font-size:1rem;margin-bottom:6px;color:var(--pink)}
.gain{text-align:center;font-weight:900;font-size:1.05rem}

/* 반짝 효과 */
.spark-layer{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.spark-layer span{position:absolute;font-size:26px;animation:burst 1.1s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(40deg)}}
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(2.2rem,12vw,3.4rem);font-weight:900;color:var(--yellow);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);white-space:nowrap;animation:stamp 1.1s ease forwards}
.stamp.bad{color:var(--red)}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-10deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1) rotate(-6deg)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:49;animation:flash .4s ease-out forwards}
@keyframes flash{from{opacity:.55}to{opacity:0}}

/* 엔딩 영상 */
.tv{background:#1c1d2b;border:4px solid var(--ink);border-radius:22px;padding:12px;box-shadow:6px 6px 0 var(--pink)}
.tv-top{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:900;font-size:.85rem;margin-bottom:10px}
.tv-top .r{color:var(--red);animation:blink 1s infinite}
.screen{position:relative;height:330px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3b3e66,#14152a);display:flex;align-items:center;justify-content:center}
.scene{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px;text-align:center;animation:enter .6s ease both}
.vis{font-size:clamp(2.6rem,13vw,3.6rem);min-height:110px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
.vis .v{display:inline-block;opacity:0;animation:enter .5s ease forwards}
.cap{color:#fff;font-weight:900;font-size:1.05rem;line-height:1.55;background:rgba(0,0,0,.45);border-radius:10px;padding:8px 12px}
.cap small{display:block;font-size:.8rem;font-weight:700;color:#ffe9a8;margin-top:4px}
.vorg{position:relative;width:110px;height:110px}
.vorg .org{width:100%;height:100%}
.vorg .face{font-size:46px}
.vorg.grow .org{animation:grow 2.4s ease-out forwards}
@keyframes grow{from{transform:translate(-50%,-50%) scale(.25)}to{transform:translate(-50%,-50%) scale(1)}}
.bar{height:8px;background:#3a3c55;border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--pink));transition:width .6s}

/* 결과 */
.cert{text-align:center;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:22px 18px;box-shadow:6px 6px 0 var(--ink);position:relative;overflow:hidden;animation:enter .6s ease both}
.cert::before{content:"";position:absolute;inset:8px;border:2px dashed var(--pink);border-radius:16px;pointer-events:none}
.cert .t{font-size:.9rem;font-weight:900;color:var(--pink);letter-spacing:2px}
.cert .nm{font-size:1.3rem;font-weight:900;margin:6px 0 10px}
.cert .pts{font-size:3rem;font-weight:900;line-height:1;color:var(--ink)}
.cert .pts small{font-size:1rem;color:#777}
.grade-emoji{font-size:4rem;margin:12px 0 4px;animation:bounce2 1.4s ease-in-out infinite}
@keyframes bounce2{50%{transform:translateY(-8px)}}
.grade{display:inline-block;font-size:1.35rem;font-weight:900;background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--ink)}
.cert p{margin-top:14px;line-height:1.6}
.ladder{display:flex;justify-content:space-between;gap:4px;margin-top:16px}
.ladder div{flex:1;font-size:.7rem;font-weight:800;padding:6px 2px;border-radius:10px;background:#f1f1f4;color:#999;line-height:1.3}
.ladder div.on{background:var(--pink);color:#fff}
.stats{margin-top:12px;font-size:.9rem;color:#555}
.tip{text-align:center;font-size:.85rem;color:#555}

@media (min-width:700px){
  #app{padding-top:28px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .bubble p,.vis .v{opacity:1}
}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ===== 사연 데이터 ===== */
const CASES = [
  {
    title: "납작하게 퍼지기만 해요",
    parent: "👩‍🔬", parentName: "금쪽이 엄마 · 3년 차 연구원",
    story: ["선생님, 저희 금쪽이가요…", "동그랗게 자라야 하는데", "바닥에 납작하게 퍼지기만 해요.", "벌써 2주째예요. 😭"],
    scope: "flat",
    caps: ["(바닥에 쫙— 붙어 버린 금쪽이)", "(입체감 0%)"],
    note: "세포들이 바닥에 한 층으로만 깔려 있어요. 위로 쌓이질 않네요.",
    diag: {
      q: "금쪽이가 납작해진 원인은 무엇일까요?",
      options: [
        { t: "평평한 2D 배양접시에서만 키웠다", ok: true, why: "평평한 바닥에서는 세포가 바닥에 붙어 한 층으로만 퍼져요. 입체 구조를 만들 발판이 없어요." },
        { t: "배양액(세포의 먹이)을 너무 많이 줬다", why: "먹이 양이 모양을 납작하게 만들진 않아요. 세포가 '어디에서' 자라는지가 핵심이에요." },
        { t: "금쪽이가 원래 게으른 성격이다", why: "금쪽이 잘못이 아니에요! 세포는 주어진 환경에 반응할 뿐이에요." },
        { t: "인큐베이터(세포 키우는 기계) 온도가 낮았다", why: "온도가 낮으면 느리게 자랄 순 있어요. 하지만 납작한 모양의 원인은 아니에요." }
      ]
    },
    presc: {
      q: "금쪽이에게 어떤 처방을 내릴까요?",

  { v: `<span class="v">🧑</span><span class="v" style="animation-delay:.4s">😊</span><span class="v" style="animation-delay:.8s">💖</span>`, c: "환자는 자기에게 꼭 맞는 약을 찾았어요!<small>실제로 환자 오가노이드로 맞춤 약을 고르는 연구가 진행 중이에요.<br>동물실험을 줄이는 데도 도움이 돼요.</small>", d: 4200 }
];

/* ===== 상태 ===== */
const app = document.getElementById("app");
const S = { name: "", idx: 0, step: 0, score: 0, caseScore: 0, first: 0, tries: 0, face: "😢", order: null, timers: [] };

function clearTimers() { S.timers.forEach(t => { clearTimeout(t); clearInterval(t); }); S.timers = []; }
function esc(s) { return s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function render(html) {
  clearTimers();
  app.innerHTML = `<div class="enter" style="display:flex;flex-direction:column;gap:14px;flex:1">${html}</div>`;
  app.className = "";
  window.scrollTo(0, 0);
}

/* ===== 효과 ===== */
function sparkle(text) {
  const layer = document.createElement("div");
  layer.className = "spark-layer";
  const icons = ["✨", "⭐", "💖", "🎉", "🌟"];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("span");
    s.textContent = icons[i % icons.length];
    s.style.left = (35 + Math.random() * 30) + "%";
    s.style.top = (30 + Math.random() * 20) + "%";
    s.style.setProperty("--dx", (Math.random() * 300 - 150) + "px");
    s.style.setProperty("--dy", (Math.random() * 300 - 180) + "px");
    s.style.animationDelay = (Math.random() * .2) + "s";
    layer.appendChild(s);
  }
  if (text) { const st = document.createElement("div"); st.className = "stamp"; st.textContent = text; layer.appendChild(st); }
  const fl = document.createElement("div"); fl.className = "flash"; fl.style.background = "#fff";
  document.body.append(layer, fl);
  setTimeout(() => { layer.remove(); fl.remove(); }, 1300);
}
function shake() {
  app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake");
  const fl = document.createElement("div"); fl.className = "flash"; fl.style.background = "#ff4d4d";
  const layer = document.createElement("div"); layer.className = "spark-layer";
  layer.innerHTML = `<div class="stamp bad">땡!</div>`;
  document.body.append(fl, layer);
  setTimeout(() => { fl.remove(); layer.remove(); }, 1100);
}

/* ===== 현미경 화면 ===== */
function orgEl(face, cls = "", style = "") { return `<div class="org ${cls}" style="${style}"><span class="face">${face}</span></div>`; }

function scope(type, face) {
  let inner = "";
  if (type === "flat") {
    const cells = [[8, 30], [70, 26], [16, 70], [64, 74], [40, 18], [44, 82]];
    inner = cells.map(([l, t]) => `<span class="flatcell" style="left:${l}%;top:${t}%"></span>`).join("") + orgEl(face, "flat");
  } else if (type === "wrong") {
    inner = orgEl(face, "wrong") + `<span class="float f1">🦴?</span><span class="float f2">🫀?</span><span class="float f3">🧠?</span><span class="float f4">🦷?</span>`;
  } else if (type === "necro") {
    const rays = Array.from({ length: 10 }, (_, i) => `<div class="ray" style="--a:${i * 36}deg;--d:${(i % 5) * -.48}s"><i></i></div>`).join("");
    inner = orgEl(face, "necro") + rays + `<span class="o2tag">● 산소·영양분</span>`;
  } else if (type === "contam") {
    const mics = [[14, 20, "🦠"], [70, 16, "🦠"], [22, 64, "🦠"], [74, 66, "🦠"], [48, 10, "🦠"], [40, 78, "🦠"], [82, 42, "🦠"], [8, 44, "🦠"]];
    const hy = [[60, 30], [20, 34], [56, 70]];
    inner = orgEl(face) + `<div class="fog"></div>` +
      hy.map(([l, t]) => `<span class="hypha" style="left:${l}%;top:${t}%"></span>`).join("") +
      mics.map(([l, t, e], i) => `<span class="mic" style="left:${l}%;top:${t}%;animation-delay:${i * .15}s">${e}</span>`).join("");
  } else if (type === "uneven") {
    const u = [
      [32, 34, 34, 34, "50%"], [72, 30, 18, 18, "50%"], [28, 72, 26, 14, "50%"],
      [68, 70, 22, 30, "40% 60% 55% 45%/60% 40% 60% 40%"], [52, 52, 12, 12, "50%"]
    ];
    inner = u.map(([l, t, w, h, r]) => orgEl(face, "u", `left:${l}%;top:${t}%;width:${w}%;height:${h}%;border-radius:${r}`)).join("");
  } else if (type === "healthy") {
    inner = orgEl(face, "healthy") + `<span class="spk" style="left:14%;top:18%">✨</span><span class="spk" style="right:14%;top:24%;animation-delay:.5s">✨</span><span class="spk" style="left:20%;bottom:16%;animation-delay:.9s">✨</span>`;
  } else if (type === "healthyMany") {
    const pos = [[30, 30], [70, 30], [30, 70], [70, 70]];
    inner = pos.map(([l, t], i) => orgEl(face, "healthy many", `left:${l}%;top:${t}%;width:28%;height:28%;animation-delay:${i * .2}s`)).join("") +
      `<span class="spk" style="left:46%;top:44%">✨</span>`;
  }
  return `<div class="scope-wrap"><div class="scope ${type}">${inner}<div class="grid"></div></div><span class="rec">● REC</span><span class="mag">×100</span></div>`;
}

/* ===== HUD ===== */
function hud() {
  const dots = NUMS.map((n, i) => `<i class="${i < S.step ? "done" : i === S.step ? "now" : ""}">${i + 1}</i>`).join("");
  return `<div class="hud"><span class="tag">사연 ${S.idx + 1}/${CASES.length}</span><div class="dots">${dots}</div><span class="score" id="score">⭐ ${S.score}점</span></div>
  <div class="steplabel">STEP ${NUMS[S.step]} ${STEP_NAMES[S.step]}</div>`;
}

/* ===== 시작 화면 ===== */
function startScreen() {
  render(`
    <div class="start" style="display:flex;flex-direction:column;flex:1">
      <div>
        <div class="logo-small">금쪽같은 내</div>
        <div class="logo-big">오가노이드</div>
        <span class="sub pink">세포 육아 상담 쇼 🧫</span>
      </div>
      <div class="mascot"><div class="org healthy"><span class="face" id="mface">😢</span></div></div>
      <div class="card desc">
        문제 행동을 보이는 <b>오가노이드</b>(줄기세포로 만든 미니 장기)를 관찰하고,
        원인을 진단해 솔루션을 처방해 주세요!
        <small>※ 줄기세포: 여러 종류의 세포로 변할 수 있는 세포</small>
      </div>
      <input class="name-input" id="nameInput" maxlength="10" placeholder="이름(닉네임)을 입력해 주세요" value="${esc(S.name)}">
      <button class="btn" id="startBtn">🎙️ 상담 시작</button>
      <div class="meta">사연 5개 · 약 5~7분 · 첫 시도 정답 +20점, 두 번째 +10점</div>
    </div>`);
  const faces = ["😢", "😐", "😊"]; let f = 0;
  S.timers.push(setInterval(() => {
    const el = document.getElementById("mface"); if (!el) return;
    f = (f + 1) % 3; el.textContent = faces[f]; el.classList.remove("change"); void el.offsetWidth; el.classList.add("change");
  }, 1100));
  const input = document.getElementById("nameInput");
  input.addEventListener("keydown", e => { if (e.key === "Enter") begin(); });
  document.getElementById("startBtn").onclick = begin;
}

function begin() {
  S.name = document.getElementById("nameInput").value.trim() || "익명";
  Object.assign(S, { idx: 0, step: 0, score: 0, caseScore: 0, first: 0, face: "😢" });
  showStep();
}

/* ===== 사연 단계 ===== */
function go(step) {
  S.step = step;
  if (step === 2 || step === 3) { S.tries = 0; S.order = shuffle([0, 1, 2, 3]); }
  showStep();
}

function showStep() {
  const c = CASES[S.idx];
  if (S.step === 0) {
    const lines = c.story.map((l, i) => `<p style="animation-delay:${.2 + i * .55}s">${l}</p>`).join("");
    render(`${hud()}
      <div class="case-title"><span class="onair">ON AIR</span><br><span class="sub big">사연 ${S.idx + 1}. “${c.title}”</span></div>
      ${S.idx === 0 ? `<div class="note">🎙️ 어서 오세요, <b>${esc(S.name)}</b> 전문가님! 오늘도 고민 많은 연구원 부모님들이 기다리고 있어요.</div>` : ""}
      <div class="parent"><div class="avatar">${c.parent}</div><div class="bubble">${lines}</div></div>
      <div class="who">${c.parentName}</div>
      <button class="btn blue" onclick="go(1)">🎥 관찰 카메라 켜기</button>`);
  } else if (S.step === 1) {
    render(`${hud()}
      ${scope(c.scope, "😢")}
      <div class="caps"><span class="sub">${c.caps[0]}</span><span class="sub pink">${c.caps[1]}</span></div>
      <div class="note">🔍 <b>관찰 노트</b><br>${c.note}</div>
      <button class="btn" onclick="go(2)">🩺 원인 진단하기</button>`);
  } else if (S.step === 2 || S.step === 3) {
    renderQuestion(S.step === 2 ? c.diag : c.presc);
  } else {
    sparkle();
    render(`${hud()}
      ${scope(c.after, "😊")}
      <div class="caps"><span class="sub">(완전히 달라진 금쪽이 ✨)</span></div>
      <div class="quote">“이건 금쪽이 잘못이 아니에요.<br><em>환경의 문제예요.</em>”</div>
      <div class="concept"><h4>📌 오늘의 육아 포인트</h4>${c.concept}</div>
      <div class="gain">이번 사연 획득 점수: <span style="color:var(--pink)">+${S.caseScore}점</span></div>
      <button class="btn mint" onclick="nextCase()">${S.idx < CASES.length - 1 ? "📮 다음 사연 받기" : "🎬 금쪽이 성장 영상 보기"}</button>`);
  }
}

function faceInfo() {
  return { "😢": "아직 아파요. 원인을 찾아 주세요!", "😐": "원인을 알았어요. 이제 처방이 필요해요!", "😊": "건강해졌어요!" }[S.face];
}

function renderQuestion(q) {
  const letters = ["A", "B", "C", "D"];
  const opts = S.order.map((oi, k) => `<button class="opt" data-i="${oi}"><b>${letters[k]}</b><span>${q.options[oi].t}</span></button>`).join("");
  render(`${hud()}
    <div class="mini"><div class="mini-org"><div class="org"><span class="face" id="mface">${S.face}</span></div></div>
      <div><b>금쪽이 상태</b><br><span id="mtext">${faceInfo()}</span></div></div>
    <div class="question">${S.step === 2 ? "🩺 " : "💊 "}${q.q}</div>
    <div class="opts">${opts}</div>
    <div id="fb"></div>`);
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(q, b));
}

function pick(q, btn) {
  if (btn.disabled) return;
  const o = q.options[+btn.dataset.i];
  const fb = document.getElementById("fb");
  S.tries++;
  if (o.ok) {
    const pts = S.tries === 1 ? 20 : S.tries === 2 ? 10 : 0;
    S.score += pts; S.caseScore += pts;
    if (S.tries === 1) S.first++;
    app.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (b !== btn && !b.classList.contains("wrong")) b.classList.add("dim"); });
    btn.classList.add("right");
    S.face = S.step === 2 ? "😐" : "😊";
    const mf = document.getElementById("mface");
    mf.textContent = S.face; mf.classList.add("change");
    document.getElementById("mtext").textContent = faceInfo();
    const sc = document.getElementById("score");
    sc.textContent = `⭐ ${S.score}점`; sc.classList.remove("pop"); void sc.offsetWidth; sc.classList.add("pop");
    sparkle(S.tries === 1 ? "딩동댕!" : "정답!");
    fb.innerHTML = `<div class="fb good"><h3>⭕ 정답이에요! ${pts ? `+${pts}점` : "(점수는 없지만 잘했어요!)"}</h3>${o.why}
      <button class="btn ${S.step === 2 ? "" : "mint"}" onclick="go(${S.step + 1})">${S.step === 2 ? "💊 금쪽 처방 내리기" : "✨ 솔루션 결과 보기"}</button></div>`;
  } else {
    btn.disabled = true; btn.classList.add("wrong");
    shake();
    fb.innerHTML = `<div class="fb bad"><h3>❌ 아쉬워요!</h3>${o.why}<br><b>다시 골라 보세요.</b>${S.tries === 1 ? " (다음에 맞히면 +10점)" : ""}</div>`;
  }
  fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function nextCase() {
  S.idx++;
  if (S.idx >= CASES.length) { ending(); return; }
  Object.assign(S, { step: 0, caseScore: 0, face: "😢" });
  showStep();
}

/* ===== 엔딩 ===== */
function ending() {
  render(`<div class="steplabel">🎬 특별 영상</div>
    <div class="caps"><span class="sub big">“금쪽이, 이렇게 컸어요”</span></div>
    <div class="tv"><div class="tv-top"><span class="r">● REC</span><span>금쪽이 성장 영상</span><span id="cnt">1/${SCENES.length}</span></div>
      <div class="screen" id="scr"></div><div class="bar"><i id="bar"></i></div></div>
    <button class="btn ghost" id="skip">건너뛰기 ⏭</button>`);
  let k = 0;
  const show = () => {
    if (k >= SCENES.length) { result(); return; }
    const sc = SCENES[k];
    document.getElementById("scr").innerHTML = `<div class="scene"><div class="vis">${sc.v}</div><div class="cap">${sc.c}</div></div>`;
    document.getElementById("bar").style.width = ((k + 1) / SCENES.length * 100) + "%";
    document.getElementById("cnt").textContent = `${k + 1}/${SCENES.length}`;
    k++;
    S.timers.push(setTimeout(show, sc.d || 2800));
  };
  show();
  document.getElementById("skip").onclick = result;
}

function result() {
  const g = GRADES.find(x => S.score >= x.min);
  const ladder = GRADES.slice().reverse().map(x => `<div class="${x === g ? "on" : ""}">${x.emoji}<br>${x.name}</div>`).join("");
  render(`<div class="steplabel">🏅 상담 종료</div>
    <div class="cert">
      <div class="t">세포 육아 전문가 인증서</div>
      <div class="nm">${esc(S.name)} 님</div>
      <div class="pts">${S.score}<small> / ${MAX_SCORE}점</small></div>
      <div class="grade-emoji">${g.emoji}</div>
      <div class="grade">${g.name}</div>
      <p>${g.msg}</p>
      <div class="ladder">${ladder}</div>
      <div class="stats">첫 시도 정답 ${S.first} / ${CASES.length * 2}문제</div>
    </div>
    <div class="quote">“모든 금쪽이는 <em>환경</em>만 맞으면<br>훌륭하게 자랄 수 있어요.”</div>
    <div class="tip">📸 화면을 캡처해서 친구와 점수를 비교해 보세요!</div>
    <button class="btn" onclick="startScreen()">🔄 다시 하기</button>`);
  sparkle();
}

startScreen();
</script>
</body>
</html>
