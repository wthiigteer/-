<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>금쪽같은 내 세포</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 하늘색 배경 위 한 열 카드 스택(최대 480px). 상담 쇼 자막 + 코끼리 오가노이드 캐릭터 */
:root{
  --sky:#e4eff9;       /* 배경 */
  --sky-2:#cfe3f5;     /* 보조 면 */
  --blue:#2f8fd8;      /* 주 버튼 */
  --cyan:#45c1d6;      /* 타이틀 2행, 강조 */
  --yellow:#ffbd12;    /* 타이틀 1행, 자막 */
  --coral:#f6857f;     /* 포인트 */
  --ink:#1f3550;       /* 글자·외곽선(남색) */
  --paper:#ffffff;
  --mint:#2fbf8a;
  --red:#ef5a5a;
  --ele:#9fd3ea;       /* 코끼리 피부 */
  --ele-line:#5aa9cf;
  --ear:#f7b8b2;
  --font-display:"Do Hyeon","Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background-color:var(--sky);
  background-image:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.75) 0 38px,transparent 39px),
    radial-gradient(circle at 88% 12%,rgba(255,255,255,.6) 0 22px,transparent 23px),
    radial-gradient(circle at 80% 78%,rgba(255,255,255,.55) 0 54px,transparent 55px),
    radial-gradient(circle at 18% 88%,rgba(69,193,214,.18) 0 30px,transparent 31px),
    radial-gradient(rgba(47,143,216,.10) 2px,transparent 2.5px);
  background-size:auto,auto,auto,auto,26px 26px;
  background-attachment:fixed;
  min-height:100vh;min-height:100dvh;
  word-break:keep-all;overflow-wrap:break-word;
}
#app{max-width:480px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#app.wide{max-width:1100px}
.screen-in{display:flex;flex-direction:column;gap:14px;flex:1;animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px) rotate(-1deg)}30%{transform:translateX(9px) rotate(1deg)}45%{transform:translateX(-7px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

/* ===== 공통 ===== */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:18px}
.btn{display:block;width:100%;padding:15px 14px;font-family:var(--font-display);font-size:1.3rem;letter-spacing:.5px;color:#fff;background:var(--blue);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.cyan{background:var(--cyan)}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.coral{background:var(--coral)}
.btn.mint{background:var(--mint)}
.btn.ghost{background:var(--paper);color:var(--ink);font-size:1.05rem;padding:11px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1;min-width:0}
.sub{display:inline-block;font-family:var(--font-display);font-size:1.15rem;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:5px 12px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg);line-height:1.35}
.sub.cyan{background:var(--cyan);color:#fff;transform:rotate(1.5deg)}
.sub.white{background:var(--paper)}
.sub.big{font-size:1.45rem;padding:8px 14px}
.steplabel{align-self:flex-start;background:var(--ink);color:var(--yellow);font-family:var(--font-display);font-size:1rem;padding:4px 14px;border-radius:999px;letter-spacing:.5px}

/* ===== 타이틀 로고(오리지널) ===== */
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--font-display);line-height:1}
.logo .l1,.logo .l2{display:flex;gap:.02em}
.logo .l1{font-size:clamp(2.3rem,11vw,3.2rem);color:var(--yellow)}
.logo .l2{font-size:clamp(3rem,15vw,4.4rem);color:var(--cyan)}
.logo span{display:inline-block;text-shadow:3px 3px 0 #fff,5px 6px 0 rgba(31,53,80,.14)}
.logo .tagline{margin-top:10px}
.logo.small .l1{font-size:1.5rem}.logo.small .l2{font-size:2rem}

/* ===== HUD ===== */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:3px 3px 0 var(--ink)}
.hud .tag{font-family:var(--font-display);font-size:1.1rem;white-space:nowrap}
.dots{display:flex;gap:4px}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.7rem;font-weight:700;background:var(--sky-2);color:#7b8fa6}
.dots i.done{background:var(--cyan);color:#fff}
.dots i.now{background:var(--yellow);color:var(--ink);transform:scale(1.15)}
.score{font-family:var(--font-display);font-size:1.2rem;white-space:nowrap;display:inline-block;font-variant-numeric:tabular-nums}
.score.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5);color:var(--coral)}100%{transform:scale(1)}}

/* ===== 코끼리 캐릭터 (em 단위, font-size로 크기 조절) ===== */
.ele{--fc:#bfe0f7;--trunk:#bfe0f7;--earc:#a3cff0;--earin:#f9bccb;--line:#4f8cc4;--eyec:var(--ink);
  --face:radial-gradient(circle at 50% 42%,#d8eefc 0,#bfe0f7 70%);
  position:relative;width:10em;height:8.6em;flex:none}
/* 크고 둥근 귀 */
.ele .ear{position:absolute;top:1.9em;width:3.9em;height:4.9em;border-radius:55% 45% 45% 55%/45% 45% 55% 55%;border:.2em solid var(--line);animation:earwiggle 3.2s ease-in-out infinite}
.ele .ear.l{left:.05em;background:radial-gradient(ellipse 30% 34% at 44% 50%,var(--earin) 96%,transparent 100%),var(--earc);transform:rotate(-8deg);transform-origin:90% 30%}
.ele .ear.r{right:.05em;border-radius:45% 55% 55% 45%/45% 45% 55% 55%;background:radial-gradient(ellipse 30% 34% at 56% 50%,var(--earin) 96%,transparent 100%),var(--earc);transform:rotate(8deg);transform-origin:10% 30%;animation-delay:.25s}
@keyframes earwiggle{0%,80%,100%{rotate:0deg}88%{rotate:-7deg}94%{rotate:5deg}}
/* 납작하고 동그란 얼굴 */
.ele .head{position:absolute;z-index:1;left:1.8em;top:1.1em;width:6.4em;height:6.4em;border-radius:50%;border:.2em solid var(--line);background:var(--face)}
/* 머리 위 새싹 */
.ele .head::before,.ele .head::after{content:"";position:absolute;top:-1.15em;left:50%;width:.95em;height:1.25em;border:.18em solid var(--line);background:#86d59a}
.ele .head::before{margin-left:-1em;border-radius:0 100% 0 100%;transform:rotate(-18deg)}
.ele .head::after{margin-left:.05em;border-radius:100% 0 100% 0;transform:rotate(18deg)}
.ele .eye{position:absolute;top:2.45em;width:.74em;height:.88em;border-radius:50%;background:var(--eyec)}
.ele .eye::after{content:"";position:absolute;top:.11em;right:.1em;width:.27em;height:.27em;border-radius:50%;background:#fff}
.ele .eye::before{content:"";position:absolute;bottom:.14em;left:.13em;width:.12em;height:.12em;border-radius:50%;background:#fff}
.ele .eye.l{left:1.65em}.ele .eye.r{right:1.65em}
.ele .brow{position:absolute;top:1.95em;width:.65em;height:.15em;border-radius:.1em;background:var(--eyec);opacity:0}
.ele .brow.l{left:1.6em}.ele .brow.r{right:1.6em}
.ele .cheek{position:absolute;top:3.45em;width:1em;height:.66em;border-radius:50%;background:#f7a3bd}
.ele .cheek.l{left:.6em}.ele .cheek.r{right:.6em}
/* 짧은 코 */
.ele .trunk{position:absolute;left:1.96em;top:3.35em;width:2.6em;height:3.47em;overflow:hidden;z-index:2}
.ele .trunk path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ele .trunk .t1{stroke:var(--line);stroke-width:10.5}
.ele .trunk .t2{stroke:var(--trunk);stroke-width:6.6}
.ele .tear{position:absolute;left:1.75em;top:3.25em;width:.4em;height:.55em;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:#5fb8f0;opacity:0;z-index:3}
.ele .acc{position:absolute;pointer-events:none}
/* 표정 */
.ele.sad{--fc:#d5e3ee;--trunk:#d5e3ee;--earc:#c4d6e5;--line:#7896b3;--face:radial-gradient(circle at 50% 42%,#e8f0f6 0,#d5e3ee 70%)}
.ele.sad .brow{opacity:1}
.ele.sad .brow.l{transform:rotate(-22deg)}.ele.sad .brow.r{transform:rotate(22deg)}
.ele.sad .eye{height:.72em;top:2.55em}
.ele.sad .tear{opacity:1;animation:drop 1.6s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(1.5em);opacity:0}}
.ele.happy .eye{background:transparent;width:.82em;height:.45em;top:2.6em;border:.18em solid var(--eyec);border-bottom:none;border-radius:.7em .7em 0 0}
.ele.happy .eye::after,.ele.happy .eye::before{display:none}
.ele.happy .cheek{transform:scale(1.15)}
/* 소품 */
.ele.mom .acc{top:-.2em;left:4.3em;width:2em;height:1.3em;z-index:3;transform:rotate(22deg)}
.ele.mom .acc::before,.ele.mom .acc::after{content:"";position:absolute;top:0;width:1em;height:1.2em;background:var(--coral);border:.18em solid var(--ink);border-radius:50% 10% 50% 10%}
.ele.mom .acc::before{left:0}.ele.mom .acc::after{right:0;transform:scaleX(-1)}
.ele.dad .acc{top:2.14em;left:1.27em;width:3.46em;height:1.5em;z-index:3}
.ele.dad .acc::before,.ele.dad .acc::after{content:"";position:absolute;top:0;width:1.5em;height:1.5em;border:.16em solid var(--ink);border-radius:50%;background:rgba(255,255,255,.3)}
.ele.dad .acc::before{left:0}.ele.dad .acc::after{right:0}
/* 움직임 */
.ele.bouncy{animation:jelly 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes jelly{0%,100%{transform:scale(1,1)}25%{transform:scale(1.05,.95)}50%{transform:translateY(-.5em) scale(.97,1.04)}75%{transform:scale(1.02,.98)}}
.ele.wave .ear.r{animation:flap .5s ease-in-out infinite alternate}
@keyframes flap{to{rotate:24deg}}

/* ===== 로딩 ===== */
.loading{justify-content:center;align-items:center;text-align:center;gap:22px}
.loading .ele{font-size:15px;animation:walk .6s ease-in-out infinite alternate}
@keyframes walk{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-8px) rotate(3deg)}}
.lbar{width:min(320px,100%);height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--cyan) 0 12px,#6fd3e3 12px 24px);animation:fill 3s linear forwards}
@keyframes fill{to{width:100%}}
.ltip{font-family:var(--font-display);font-size:1.25rem;min-height:1.6em}
.lpct{font-family:var(--font-display);font-size:1.1rem;color:var(--blue);font-variant-numeric:tabular-nums}

/* ===== 시작 ===== */
.start{justify-content:center;text-align:center;gap:16px}
.start .ele{font-size:16px;margin:0 auto}
.talk{display:flex;flex-direction:column;align-items:center;gap:10px}
.say{position:relative;font-size:.98rem;line-height:1.5;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:9px 16px;animation:enter .5s ease .2s both}
.say::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top:11px solid var(--ink);border-bottom:0}
.say::before{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top:9px solid var(--paper);border-bottom:0;z-index:1}
.say b{font-weight:700;color:var(--blue)}
.desc{font-size:1rem;line-height:1.65;text-align:left}
.desc small{display:block;margin-top:6px;color:#5d7088;font-size:.86rem}
.name-input{display:block;width:100%;padding:12px 14px;font:inherit;font-size:1.05rem;font-weight:700;line-height:1.45;text-align:center;color:var(--ink);border:3px solid var(--ink);border-radius:14px;outline:none;background:var(--paper);resize:none}
.name-err{color:var(--red);font-size:.88rem;font-weight:700;min-height:0;margin-top:-6px}
.name-err:empty{display:none}
.name-input::placeholder{color:#a3afbd;font-size:.88rem;font-weight:400}
.meta{font-size:.86rem;color:#4d6178}

/* ===== 사연 접수 ===== */
.case-title{text-align:center}
.onair{display:inline-block;background:var(--red);color:#fff;font-family:var(--font-display);font-size:.95rem;padding:2px 10px;border-radius:6px;margin-bottom:8px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.parent{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:none;width:72px;height:72px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar .ele{font-size:6.4px}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;box-shadow:4px 4px 0 var(--ink)}
.bubble::before{content:"";position:absolute;left:-14px;top:22px;border:8px solid transparent;border-right:12px solid var(--ink)}
.bubble p{font-size:1.05rem;font-weight:700;line-height:1.55;opacity:0;animation:enter .4s ease forwards}
.who{font-size:.86rem;color:#4d6178;margin-left:82px;margin-top:-6px}
.note{background:var(--paper);border:2px dashed var(--ink);border-radius:14px;padding:12px 14px;font-size:.98rem;line-height:1.6}

/* ===== 현미경 ===== */
.scope-wrap{position:relative;width:min(78vw,300px);max-width:100%;margin:6px auto 0}
.scope{position:relative;width:100%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;border:12px solid var(--blue);outline:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);container-type:inline-size;
  background:radial-gradient(circle,#ffffff 0,#eef6fc 65%,#d4e6f4 100%);display:grid;place-items:center}
.scope::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 40px rgba(31,53,80,.3);pointer-events:none}
.scope .ele{font-size:4.8cqw}
.grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent calc(50% - 1px),rgba(31,53,80,.1) 50%,transparent calc(50% + 1px)),linear-gradient(90deg,transparent calc(50% - 1px),rgba(31,53,80,.1) 50%,transparent calc(50% + 1px))}
.rec{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;font-family:var(--font-display);font-size:.9rem;padding:2px 8px;border-radius:8px;border:2px solid var(--ink);animation:blink 1.2s infinite}
.mag{position:absolute;bottom:-2px;right:-4px;background:var(--paper);font-family:var(--font-display);font-size:.9rem;padding:2px 8px;border-radius:8px;border:2px solid var(--ink)}
/* 1 납작 */
.scope .ele.flat{animation:spread 2.4s ease-in-out infinite alternate}
@keyframes spread{from{transform:scale(1.25,.38)}to{transform:scale(1.7,.3)}}
.flatcell{position:absolute;width:15%;height:5%;border-radius:50%;background:var(--ele);border:2px solid var(--ele-line);opacity:.6}
/* 2 정체성 혼란 */
.ele.wrong{--trunk:#d6c6ff;--fc:#d6c6ff;--face:conic-gradient(from 30deg,#b8f2a1,#c9a7ff,#ffd59e,#9ad7ff,#b8f2a1);--earc:#c9a7ff;--earin:#b8f2a1}
.ele.wrong{animation:wobble 2.2s ease-in-out infinite}
@keyframes wobble{25%{transform:rotate(-6deg) scale(1.03,.97)}75%{transform:rotate(6deg) scale(.97,1.03)}}
.float{position:absolute;font-family:var(--font-display);font-size:clamp(15px,4.6vw,20px);background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:1px 7px;animation:fl 1.8s ease-in-out infinite}
.float.f1{left:9%;top:15%}.float.f2{right:8%;top:20%;animation-delay:.4s}.float.f3{left:10%;bottom:16%;animation-delay:.8s}.float.f4{right:10%;bottom:14%;animation-delay:1.2s}
@keyframes fl{50%{transform:translateY(-7px) rotate(4deg)}}
/* 3 괴사 */
.ele.necro .head{background:radial-gradient(circle at 50% 56%,#111 0 1em,#3b2c33 1.6em,#7b7f9a 2.2em,var(--fc) 3em)}
.ray{position:absolute;inset:0;transform:rotate(var(--a));pointer-events:none}
.ray i{position:absolute;top:calc(50% - 5px);left:95%;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 6px var(--blue);animation:diffuse 2.4s linear infinite;animation-delay:var(--d)}
@keyframes diffuse{0%{left:95%;opacity:1}65%{opacity:.9}100%{left:70%;opacity:0}}
.o2tag{position:absolute;top:7%;left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:700;color:var(--blue);background:var(--paper);border-radius:8px;padding:1px 6px;border:2px solid var(--blue);white-space:nowrap}
/* 4 오염 */
.scope.contam{background:radial-gradient(circle,#fbf3c4 0,#efe08f 70%,#d8c46a 100%)}
.ele.contam{filter:blur(2.5px);opacity:.55}
.fog{position:absolute;inset:-10%;background:radial-gradient(circle at 30% 40%,rgba(235,232,215,.85),transparent 45%),radial-gradient(circle at 70% 60%,rgba(225,222,205,.85),transparent 50%),radial-gradient(circle at 50% 50%,rgba(240,238,225,.5),transparent 70%);animation:fog 5s ease-in-out infinite alternate}
@keyframes fog{to{transform:translate(6%,-4%) scale(1.08)}}
.mic{position:absolute;font-size:clamp(16px,5vw,22px);animation:wiggle 1.1s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(4px,-3px) rotate(15deg)}66%{transform:translate(-3px,3px) rotate(-12deg)}}
.hypha{position:absolute;width:18%;height:18%;border-radius:50%;border:2px dashed rgba(110,110,110,.7);background:radial-gradient(circle,rgba(150,150,150,.5),transparent 70%)}
/* 6 피부세포 그대로 */
.spindle{position:absolute;width:24%;height:6%;border-radius:50%;background:radial-gradient(circle,#c97c63 0 8%,#f4c4ae 12%);border:2px solid #d99a80;opacity:.85;animation:fl 3s ease-in-out infinite}
.ele.ghost{opacity:.35;filter:grayscale(1)}
.ele.ghost .head,.ele.ghost .ear{border-style:dashed}
/* 5 제각각 / 형제들 */
.pos{position:absolute;transform:translate(-50%,-50%)}
.pos .ele{font-size:var(--fs)}
.spk{position:absolute;font-size:clamp(14px,4.5vw,20px);animation:twinkle 1.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}
.caps{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px}
/* ===== 예능 자막 ===== */
.tvsub{--sc:var(--ink);font-family:"Black Han Sans",var(--font-display);font-weight:400;font-size:clamp(1.45rem,6.8vw,1.85rem);line-height:1.3;color:#fff;text-align:center;letter-spacing:.01em;
  text-shadow:0.090em 0.000em 0 var(--sc),0.083em 0.034em 0 var(--sc),0.064em 0.064em 0 var(--sc),0.034em 0.083em 0 var(--sc),0.000em 0.090em 0 var(--sc),-0.034em 0.083em 0 var(--sc),-0.064em 0.064em 0 var(--sc),-0.083em 0.034em 0 var(--sc),-0.090em 0.000em 0 var(--sc),-0.083em -0.034em 0 var(--sc),-0.064em -0.064em 0 var(--sc),-0.034em -0.083em 0 var(--sc),-0.000em -0.090em 0 var(--sc),0.034em -0.083em 0 var(--sc),0.064em -0.064em 0 var(--sc),0.083em -0.034em 0 var(--sc),0.050em 0.000em 0 var(--sc),0.046em 0.019em 0 var(--sc),0.035em 0.035em 0 var(--sc),0.019em 0.046em 0 var(--sc),0.000em 0.050em 0 var(--sc),-0.019em 0.046em 0 var(--sc),-0.035em 0.035em 0 var(--sc),-0.046em 0.019em 0 var(--sc),-0.050em 0.000em 0 var(--sc),-0.046em -0.019em 0 var(--sc),-0.035em -0.035em 0 var(--sc),-0.019em -0.046em 0 var(--sc),-0.000em -0.050em 0 var(--sc),0.019em -0.046em 0 var(--sc),0.035em -0.035em 0 var(--sc),0.046em -0.019em 0 var(--sc),0 .16em 0 rgba(31,53,80,.28)}
.tvsub em{font-style:normal;color:#3fd0c9}
.tvsub.big{font-size:clamp(1.7rem,8vw,2.2rem)}
.tvsub.alert{--sc:#d93b32;position:relative;display:inline-block;padding:0 1.15em}
.tvsub.alert::before,.tvsub.alert::after{content:"";position:absolute;bottom:.02em;width:1em;height:.95em;background:#ff6b5e;
  clip-path:polygon(0 100%,8% 18%,30% 62%,50% 0,70% 62%,92% 18%,100% 100%)}
.tvsub.alert::before{left:0;transform:rotate(-14deg)}
.tvsub.alert::after{right:0;transform:rotate(14deg)}
.ep-tag{display:inline-block;background:var(--paper);color:var(--ink);font-weight:700;font-size:.85rem;border:2px solid var(--cyan);border-left:8px solid var(--cyan);border-radius:4px;padding:2px 10px;margin-bottom:6px}


/* ===== 문제 ===== */
.mini{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 12px}
.mini .face-box{width:58px;height:50px;flex:none;display:grid;place-items:center}
.mini .ele{font-size:5.6px}
.mini b{font-family:var(--font-display);font-size:1.05rem;font-weight:400}
.mini span{font-size:.86rem;color:#4d6178}
.question{font-size:1.12rem;font-weight:700;line-height:1.5;background:var(--paper);border:3px solid var(--ink);border-left:10px solid var(--cyan);border-radius:14px;padding:12px 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;font:inherit;font-size:1rem;font-weight:600;line-height:1.45;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,background .2s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:400;font-size:1.05rem}
.opt span{min-width:0}
.opt:disabled{cursor:default}
.opt.wrong{background:#ffe6e6;color:#9b2c2c;box-shadow:0 2px 0 #9b2c2c;border-color:#9b2c2c;opacity:.85}
.opt.wrong b{background:var(--red);color:#fff;border-color:#9b2c2c}
.opt.right{background:#dcf6ec;border-color:#1d8a62;box-shadow:0 4px 0 #1d8a62;animation:pop .5s}
.opt.right b{background:var(--mint);color:#fff}
.opt.dim{opacity:.45}
.fb{border:3px solid var(--ink);border-radius:16px;padding:14px;line-height:1.6;font-size:.98rem;animation:enter .35s ease both;background:var(--paper)}
.fb.bad{background:#fff3f3;border-color:var(--red)}
.fb.good{background:#effbf6;border-color:var(--mint)}
.fb h3{font-family:var(--font-display);font-weight:400;font-size:1.35rem;margin-bottom:4px}
.fb .btn{margin-top:12px}

/* ===== 솔루션 후 ===== */
.quote{position:relative;text-align:center;background:var(--ink);color:#fff;border-radius:18px;padding:20px 14px 16px;font-family:var(--font-display);font-size:1.4rem;line-height:1.45;box-shadow:5px 5px 0 var(--cyan)}
.quote em{font-style:normal;color:var(--yellow)}
.quote::before{content:"명대사";position:absolute;top:-13px;left:14px;background:var(--yellow);color:var(--ink);font-size:.95rem;padding:1px 12px;border-radius:999px;border:2px solid var(--ink)}
.concept{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:14px;line-height:1.65}
.concept h4{font-family:var(--font-display);font-weight:400;font-size:1.2rem;margin-bottom:4px;color:var(--blue)}
.gain{text-align:center;font-family:var(--font-display);font-size:1.3rem}
.gain span{color:var(--coral)}

/* ===== 효과 ===== */
.spark-layer{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.spark-layer span{position:absolute;font-size:26px;animation:burst 1.1s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(40deg)}}
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--font-display);font-size:clamp(3rem,15vw,4.2rem);color:var(--yellow);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);white-space:nowrap;animation:stamp 1.1s ease forwards}
.stamp.bad{color:var(--red)}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-10deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1) rotate(-6deg)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:49;animation:flash .4s ease-out forwards}
@keyframes flash{from{opacity:.5}to{opacity:0}}

/* ===== 성장 영상 ===== */
.tv{background:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:12px;box-shadow:6px 6px 0 var(--cyan)}
.tv-top{display:flex;justify-content:space-between;align-items:center;color:#fff;font-family:var(--font-display);font-size:1rem;margin-bottom:10px}
.tv-top .r{color:#ff8080;animation:blink 1s infinite}
.screen{position:relative;height:340px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3c6c98,#17304d);display:flex;align-items:center;justify-content:center}
.scene{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;text-align:center;animation:enter .6s ease both}
.vis{font-size:clamp(2.6rem,13vw,3.4rem);min-height:120px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
.vis .v{display:inline-block;opacity:0;animation:enter .5s ease forwards}
.vis .ele{font-size:12px}
.vis .grow{animation:grow 2.4s ease-out forwards}
.osvg{display:block;max-width:100%;overflow:visible;animation:breathe 3s ease-in-out infinite}
.osvg .cl{transform-box:fill-box;transform-origin:center;animation:cellpop .45s ease-out both}
@keyframes cellpop{from{transform:scale(0);opacity:0}}
@keyframes breathe{50%{transform:scale(1.04)}}
.dose{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85rem;color:#fff;font-weight:700}
.dose b{font-size:1.4rem;opacity:0;animation:enter .4s ease forwards}
.dose.bad .osvg{animation:wilt .8s ease var(--d) forwards}
.dose.good .osvg{animation:thrive .8s ease var(--d) forwards}
@keyframes wilt{to{transform:scale(.78);filter:grayscale(1) brightness(.7)}}
@keyframes thrive{to{transform:scale(1.12);filter:drop-shadow(0 0 6px #ffe39a)}}
@keyframes grow{from{transform:scale(.3)}to{transform:scale(1)}}
.cap{color:#fff;font-weight:700;font-size:1.02rem;line-height:1.55;background:rgba(0,0,0,.35);border-radius:10px;padding:8px 12px}
.cap small{display:block;font-size:.8rem;font-weight:600;color:#ffe39a;margin-top:4px}
.bar{height:8px;background:#35506e;border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--cyan));transition:width .6s}

/* ===== 결과 ===== */
.cert{text-align:center;background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:22px 18px;box-shadow:6px 6px 0 var(--ink);position:relative;overflow:hidden;animation:enter .6s ease both}
.cert::before{content:"";position:absolute;inset:8px;border:2px dashed var(--cyan);border-radius:16px;pointer-events:none}
.cert .t{font-family:var(--font-display);font-size:1.1rem;color:var(--blue);letter-spacing:2px}
.cert .nm{font-family:var(--font-display);font-size:1.6rem;margin:4px 0 8px}
.cert .pts{font-family:var(--font-display);font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.cert .pts small{font-size:1.2rem;color:#6b7f96}
.grade-emoji{font-size:3.4rem;margin:10px 0 4px;animation:bob 1.4s ease-in-out infinite}
.grade{display:inline-block;font-family:var(--font-display);font-size:1.6rem;background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:4px 14px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--ink)}
.cert p{margin-top:12px;line-height:1.6}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px}
.ladder div{font-size:.72rem;font-weight:700;padding:6px 2px;border-radius:10px;background:var(--sky);color:#7b8fa6;line-height:1.3}
.ladder div.on{background:var(--blue);color:#fff}
.stats{margin-top:10px;font-size:.9rem;color:#4d6178}
.rank-status{text-align:center;font-weight:700;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:12px;line-height:1.5}
.rank-status b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;color:var(--blue)}

/* ===== 랭킹 ===== */
.rank-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.rank-head h2{font-family:var(--font-display);font-weight:400;font-size:2rem;line-height:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 10px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.live.local i{background:#9aa9b9;animation:none}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:4px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.pod .ele{font-size:5.5px}
.pod.p1 .ele{font-size:7px}
.pod .nm{font-weight:700;font-size:.92rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-family:var(--font-display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.pod .block{width:100%;border:3px solid var(--ink);border-bottom:none;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:var(--font-display);font-size:1.6rem;color:#fff}
.pod.p1 .block{height:84px;background:var(--yellow);color:var(--ink)}
.pod.p2 .block{height:62px;background:var(--cyan)}
.pod.p3 .block{height:46px;background:var(--coral)}
.pod.empty .nm{color:#8a9bb0}
.podium-base{height:10px;background:var(--ink);border-radius:0 0 8px 8px;margin-top:-8px}
.rlist{list-style:none;display:flex;flex-direction:column;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px;box-shadow:4px 4px 0 var(--ink);max-height:52vh;overflow-y:auto}
.rlist li{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--sky)}
.rlist li.me{background:#fff4d1;outline:2px solid var(--yellow)}
.rlist .no{font-family:var(--font-display);font-size:1.2rem;text-align:center;font-variant-numeric:tabular-nums}
.rlist .who2{min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .who2 small{font-weight:600;color:#5d7088;margin-left:4px}
.rlist .pt{font-family:var(--font-display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.rempty{text-align:center;color:#5d7088;padding:18px 8px;line-height:1.6}
.rnote{font-size:.85rem;color:#4d6178;text-align:center;line-height:1.55}

/* ===== 엔딩(크레딧) ===== */
.end{justify-content:center;align-items:center;text-align:center;gap:18px}
.end .ele{font-size:14px}
.credits{width:100%;height:190px;overflow:hidden;position:relative;background:var(--ink);color:#fff;border-radius:18px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--cyan);-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.roll{position:absolute;left:0;right:0;top:100%;display:flex;flex-direction:column;gap:14px;padding:0 16px;animation:roll 16s linear infinite}
.roll div{line-height:1.45}
.roll small{display:block;color:var(--cyan);font-size:.8rem;font-weight:700;letter-spacing:1px}
.roll b{font-family:var(--font-display);font-weight:400;font-size:1.3rem}
@keyframes roll{to{transform:translateY(calc(-100% - 190px))}}
.disclaimer{font-size:.78rem;color:#5d7088;line-height:1.5}

/* ===== 진행자용 랭킹판 (#board) ===== */
.board{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
.board .left{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.qr{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px;box-shadow:5px 5px 0 var(--ink)}
.qr canvas,.qr img{display:block;width:220px;height:220px}
.url{font-weight:700;font-size:.9rem;word-break:break-all;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:6px 10px}
.board .rlist{max-height:none}
.count{font-family:var(--font-display);font-size:1.3rem}
@media (max-width:760px){.board{grid-template-columns:1fr}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .bubble p,.vis .v{opacity:1}
  .lbar i{width:100%}
}
/* =========================================================
   탄생 편 전용 스타일 (위 공통 디자인 시스템 위에 얹어요)
   ========================================================= */
#app{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.logo .chips{display:flex;gap:5px;align-self:flex-end;margin:0 14% 2px 0}
.logo .chips span{font-family:var(--font-display);font-size:.95rem;color:#fff;background:var(--cyan);border-radius:4px;padding:1px 8px;text-shadow:none;transform:rotate(-4deg)}
.logo .chips span+span{transform:rotate(3deg)}
.logo.small .chips span{font-size:.75rem}
.hud{padding:8px 8px;gap:6px}
.hud .dots{gap:3px}
.hud .dots i{width:19px;height:19px;font-size:.62rem}
.hud .score,.hud .tag{font-size:1.05rem}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{height:110px;font-family:var(--font-display);font-size:3.4rem;line-height:1;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.ox .o{color:#1d8a8a}.ox .x{color:var(--coral)}
.ox button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ox button.right{background:#dcf6ec;border-color:#1d8a62}
.ox button.wrong{background:#ffe6e6;border-color:#9b2c2c}
.ox button:disabled{cursor:default}
.ox-q{font-size:1.2rem;font-weight:700;line-height:1.6;background:var(--paper);border:3px solid var(--ink);border-left:10px solid var(--cyan);border-radius:14px;padding:14px}
.ox-q b{color:#1d8a8a}
.howto{background:var(--paper);border:3px solid var(--ink);border-left:10px solid var(--yellow);border-radius:16px;padding:14px 16px;box-shadow:4px 4px 0 var(--ink);animation:enter .35s ease both}
.howto h3{font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.howto ol{padding-left:1.3em;margin-top:6px;display:flex;flex-direction:column;gap:4px;line-height:1.55;font-weight:600}
.howto .tip{margin-top:8px;font-size:.88rem;color:#4d6178;line-height:1.5}
.play{display:flex;flex-direction:column;gap:14px}
.ep-sub{display:inline-block;margin-top:6px;font-family:var(--font-display);font-size:1.25rem;color:#fff;background:var(--coral);border:3px solid var(--ink);border-radius:10px;padding:2px 14px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--ink)}

/* 방송 정보 바(좌상단) */
.epbar{align-self:flex-start;display:flex;flex-direction:column;max-width:100%;border:2px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.epbar b{background:var(--cyan);color:#fff;font-family:var(--font-display);font-weight:400;font-size:.95rem;padding:2px 10px;letter-spacing:.3px}
.epbar span{background:var(--paper);font-weight:700;font-size:.88rem;padding:3px 10px;line-height:1.4}

/* 무대(관찰 카메라 화면) */
.stage{position:relative;background:radial-gradient(circle at 50% 30%,#ffffff,#dcebf8);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:40px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden;min-height:200px;justify-content:center}
.stage .rec{top:8px;left:8px}
.stage .camtag{position:absolute;top:8px;right:8px;background:var(--paper);font-family:var(--font-display);font-size:.85rem;padding:1px 8px;border-radius:8px;border:2px solid var(--ink)}
.stage .orgs{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;min-height:120px}

/* 전문가 코칭 */
.expert{display:flex;gap:10px;align-items:flex-start}
.ex-ava{flex:none;width:66px;height:66px;border-radius:50%;background:var(--sky-2);border:3px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.ex-ava .ele{font-size:6px;margin-top:6px}
.ex-bub{flex:1;min-width:0;background:var(--yellow);border:3px solid var(--ink);border-radius:4px 18px 18px 18px;padding:9px 14px 11px;box-shadow:3px 3px 0 var(--ink);animation:enter .4s ease both}
.ex-bub .tag{display:inline-block;background:var(--ink);color:var(--yellow);font-family:var(--font-display);font-size:.85rem;padding:1px 10px;border-radius:999px;margin-bottom:4px}
.ex-bub p{font-weight:700;line-height:1.55;font-size:1rem}

/* 위기 자막 */
.crisis-layer{position:fixed;inset:0;pointer-events:none;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-inline:16px}
.crisis-layer .tvsub{animation:crisisIn 1.5s ease forwards}
.crisis-layer .why{font-family:var(--font-display);font-size:1.15rem;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:3px 12px;animation:crisisIn 1.5s ease forwards}
@keyframes crisisIn{0%{opacity:0;transform:scale(2) rotate(-6deg)}18%{opacity:1;transform:scale(1) rotate(-3deg)}78%{opacity:1;transform:scale(1) rotate(-3deg)}100%{opacity:0;transform:scale(.95) rotate(-3deg)}}

/* 금쪽이 성장 단계: 주름(크립트) 돌기 */
.ele .buds{position:absolute;left:1.8em;top:1.1em;width:6.4em;height:6.4em;border-radius:50%}
.ele.lv2 .buds{box-shadow:
  -2.4em -2.4em 0 -2.1em var(--fc),2.4em -2.4em 0 -2.1em var(--fc),-2.4em 2.4em 0 -2.1em var(--fc),2.4em 2.4em 0 -2.1em var(--fc),
  -2.4em -2.4em 0 -1.9em var(--line),2.4em -2.4em 0 -1.9em var(--line),-2.4em 2.4em 0 -1.9em var(--line),2.4em 2.4em 0 -1.9em var(--line)}
.ele.lv3 .buds{box-shadow:
  0 -3.5em 0 -2em var(--fc),2.47em -2.47em 0 -2em var(--fc),2.47em 2.47em 0 -2em var(--fc),0 3.5em 0 -2em var(--fc),-2.47em 2.47em 0 -2em var(--fc),-2.47em -2.47em 0 -2em var(--fc),

/* 3단계: 3요소 잡기 */

/* 6단계: 고민 말풍선 */

.bb:nth-child(2n){animation-delay:.6s}.bb:nth-child(3n){animation-delay:1.1s}

.three h3{font-family:var(--font-display);font-weight:400;font-size:1.35rem;margin-bottom:8px}

.eq span small{font-family:var(--font-body);font-size:.75rem;font-weight:700;color:var(--blue)}

.brk td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-display);font-weight:400;font-size:1.05rem}

<body>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script>
/* =========================================================
   랭킹 저장소
   1) claude.ai 아티팩트로 열면: 아티팩트 공유 데이터베이스
   2) 일반 웹(GitHub Pages 등) + 아래 Firebase 설정이 있으면: Firestore (birth_rooms)
   3) 둘 다 없으면: 이 기기 기록
   ?room=코드 를 주소에 붙이면 회차별 랭킹이 따로 쌓여요. (Firebase/이 기기 기록 모드)
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const FIREBASE_VERSION = "10.12.2";

/* ===== 게임 데이터 ===== */
const MAX = { 1: 20, 2: 20, 3: 20, 4: 40, 5: 20, 6: 20, 7: 20 };
const MAX_SCORE = 160;
const STAGES = {
  1: { name: "금쪽이 프로필", tag: "오가노이드란?" },
  2: { name: "금쪽이 탄생", tag: "오가노이드는 어떻게 생길까요?" },
  3: { name: "3요소 잡기", tag: "오가노이드의 배양 환경" },
  4: { name: "사연 상담", tag: "“납작하게 퍼지기만 해요” “피부세포로 만들었는데 아무것도 안 돼요”" },
  5: { name: "진로 상담", tag: "오가노이드가 왜 필요할까요? 어디에 쓰일까요?" },
  6: { name: "고민 상담", tag: "한계 · 함께 고민할 점 · 앞으로의 연구" },
  7: { name: "총정리 퀴즈", tag: "금쪽이 졸업 시험" },

};
const GRADES = [
  { min: 136, name: "세포 육아 마스터", emoji: "👑", msg: "완벽한 육아! 금쪽이가 당신을 자랑스러워해요." },
  { min: 104, name: "육아 고수", emoji: "🥇", msg: "금쪽이가 아주 건강하게 자랐어요. 거의 전문가 수준이에요!" },
  { min: 64, name: "육아 새내기", emoji: "🌱", msg: "기본은 잡았어요! 헷갈린 부분만 다시 보면 금방 고수가 돼요." },
  { min: 0, name: "초보 부모", emoji: "🍼", msg: "괜찮아요, 모든 부모는 처음이에요. 다시 하면 금쪽이가 더 잘 클 거예요!" }
];
const gradeOf = s => GRADES.find(g => s >= g.min);
const LOAD_TIPS = ["줄기세포 깨우는 중…", "유도 신호 보내는 중…", "3D 배양 준비하는 중…", "금쪽이 육아 일기 펴는 중…"];

/* ===== 기본 도구 ===== */
const app = document.getElementById("app");
const S = { name: "", stage: 0, score: 0, pts: {}, first: 0, level: 0, day: 0, lastDay: 0, timers: [], cleanups: [], submitted: false, myId: null, kept: 0 };
function clearTimers() { S.timers.forEach(t => { clearTimeout(t); clearInterval(t); }); S.timers = []; S.cleanups.forEach(f => { try { f(); } catch (e) {} }); S.cleanups = []; }
function every(fn, ms) { const id = setInterval(fn, ms); S.timers.push(id); return id; }
function later(fn, ms) { const id = setTimeout(fn, ms); S.timers.push(id); return id; }
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function render(html, wide) {
  clearTimers();
  app.innerHTML = `<div class="screen-in">${html}</div>`;
  app.className = wide ? "wide" : "";
  window.scrollTo(0, 0);
}
function logo(cls = "") {
  const rot = [-5, 3, -2, 4, -4, 2, -3, 5];
  const chars = (t, o) => [...t].map((c, i) => c === " " ? `<span style="width:.3em"></span>` : `<span style="transform:rotate(${rot[(i + o) % rot.length]}deg)">${c}</span>`).join("");
  return `<div class="logo ${cls}"><div class="chips"><span>요즘</span><span>과학</span></div><div class="l1">${chars("금쪽같은", 0)}</div><div class="l2">${chars("내 세포", 3)}</div></div>`;
}

/* ===== 코끼리 금쪽이 ===== */
function ele(mood = "meh", cls = "", style = "") {
  return `<div class="ele ${mood} ${cls}" style="${style}" aria-hidden="true"><i class="buds"></i><i class="ear l"></i><i class="ear r"></i><div class="head"><i class="brow l"></i><i class="brow r"></i><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><svg class="trunk" viewBox="0 0 30 40"><path class="t1" d="M12 -4 C12 10 11 20 14 27 C16.5 32.5 22 33 23.5 28.5"/><path class="t2" d="M12 -4 C12 10 11 20 14 27 C16.5 32.5 22 33 23.5 28.5"/></svg><i class="tear"></i><i class="acc"></i></div></div>`;
}
const LV_SIZE = [8, 11, 12, 13];
// 단계가 지날수록 금쪽이 모양이 복잡해져요: 공 → 돌기 → 주름진 장 모양
function org(mood = "happy", cls = "", size, level = S.level) {
  return ele(mood, `lv${level} ${cls}`, `font-size:${size || LV_SIZE[level]}px`);
}
function setMood(root, mood) {
  const e = root.matches && root.matches(".ele") ? root : $(".ele", root); if (!e) return;
  ["sad", "meh", "happy", "cold", "hot"].forEach(m => e.classList.remove(m));
  mood.split(" ").forEach(m => m && e.classList.add(m));
}

/* ===== 화면 조각 ===== */
function hud() {
  const dots = [1, 2, 3, 4, 5, 6, 7].map(i => `<i class="${i < S.stage ? "done" : i === S.stage ? "now" : ""}">${i}</i>`).join("");
  return `<div class="hud"><span class="tag">${S.stage > 7 ? "엔딩" : S.stage + "단계"}</span><div class="dots">${dots}</div><span class="score" id="score">⭐ ${S.score}점</span></div>`;
}
function epbar(day) { return `<div class="epbar"><b>금쪽이 육아 ${day}</b><span>${STAGES[S.stage].tag}</span></div>`; }
function head(day) { return hud() + epbar(day) + `<div class="steplabel">${S.stage > 7 ? "ENDING" : "STEP " + S.stage} · ${STAGES[S.stage].name}</div>`; }
function stageBox(inner, cap, alert) {
  return `<div class="stage"><span class="rec">● 관찰 카메라</span><span class="camtag">${S.stage > 7 ? "엔딩" : S.stage + "단계"}</span><div class="orgs" id="orgs">${inner}</div>${cap ? `<div class="tvsub ${alert ? "alert" : ""}">${cap}</div>` : ""}</div>`;
}
function sit(t) { return `<div class="card desc">${t}</div>`; }
function expert(t) { return `<div class="expert"><div class="ex-ava">${ele("happy", "dad")}</div><div class="ex-bub"><span class="tag">세포 육아 전문가</span><p>${t}</p></div></div>`; }
// 미니게임 시작 전 '게임 방법' 카드
function howto(title, steps, tip) {
  return `<div class="howto" id="howto"><h3>🎮 게임 방법 · ${title}</h3><ol>${steps.map(x => `<li>${x}</li>`).join("")}</ol>${tip ? `<p class="tip">${tip}</p>` : ""}<button class="btn yellow" id="howGo" style="margin-top:12px">알겠어요, 시작!</button></div>`;
}
function onHowGo(fn) {
  const b = $("#howGo");
  if (!b) { fn && fn(); return; }
  b.onclick = () => { $("#howto").remove(); const pl = $("#play"); if (pl) pl.hidden = false; fn && fn(); };
}
function fbBox(type, title, body) { return `<div class="fb ${type}"><h3>${title}</h3><div>${body}</div></div>`; }
function addNext(el, fn, label = "다음 →", cls = "") {
  const b = document.createElement("button"); b.className = "btn " + cls; b.innerHTML = label;
  b.style.marginTop = "12px";
  b.onclick = () => { b.disabled = true; fn(); };
  el.appendChild(b);
  setTimeout(() => b.scrollIntoView({ behavior: "smooth", block: "nearest" }), 150);
  return b;
}
function addScore(n, first) {
  if (first) S.first++;
  if (n <= 0) return;
  S.score += n; S.pts[S.stage] = (S.pts[S.stage] || 0) + n;
  const el = $("#score"); if (el) { el.textContent = `⭐ ${S.score}점`; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
}

/* ===== 효과 ===== */
function sparkle(text) {
  const layer = document.createElement("div");
  layer.className = "spark-layer";
  const icons = ["✨", "⭐", "💙", "🎉", "🌟"];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("span");
    s.textContent = icons[i % icons.length];
    s.style.left = (35 + Math.random() * 30) + "%";
    s.style.top = (30 + Math.random() * 20) + "%";
    s.style.setProperty("--dx", (Math.random() * 300 - 150) + "px");
    s.style.setProperty("--dy", (Math.random() * 300 - 180) + "px");
    s.style.animationDelay = (Math.random() * .2) + "s";
    layer.appendChild(s);
  }
  if (text) { const st = document.createElement("div"); st.className = "stamp"; st.textContent = text; layer.appendChild(st); }
  const fl = document.createElement("div"); fl.className = "flash"; fl.style.background = "#fff";
  document.body.append(layer, fl);
  setTimeout(() => { layer.remove(); fl.remove(); }, 1300);
}
function crisis(why) {
  app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake");
  const fl = document.createElement("div"); fl.className = "flash"; fl.style.background = "#ef5a5a";
  const layer = document.createElement("div"); layer.className = "crisis-layer";
  layer.innerHTML = `<div class="tvsub big alert">금쪽이 <em style="color:#ffd84d">위기!</em></div>${why ? `<div class="why">${why}</div>` : ""}`;
  document.body.append(fl, layer);
  setTimeout(() => { fl.remove(); layer.remove(); }, 1550);
  try { navigator.vibrate && navigator.vibrate(160); } catch (e) {}
}
function dayFlip(to, cb) {
  let cur = Math.min(S.lastDay, to);
  const f = document.createElement("div"); f.className = "flip";
  f.innerHTML = `<div class="clock">⏩</div><div class="tvsub big">금쪽이 육아 <em id="fd">${cur}</em>일차</div><small>시간이 빠르게 흘러요…</small>`;
  document.body.appendChild(f);
  const id = setInterval(() => {
    if (cur < to) { cur++; $("#fd").textContent = cur; return; }
    clearInterval(id);
    setTimeout(() => { f.remove(); S.lastDay = to; cb(); }, 500);
  }, Math.max(80, Math.min(240, 1800 / Math.max(1, to - cur))));
}

/* ===== 4지선다: 첫 시도 +20, 두 번째 +10, 두 번 틀리면 정답 공개 ===== */
function quiz(box, q, opts, onDone, onWrong) {
  const list = shuffle(opts); let tries = 0, done = false;
  box.innerHTML = `<div class="question">${q}</div><div class="opts" style="margin-top:10px">${list.map((o, i) => `<button class="opt" data-i="${i}"><b>${"ABCD"[i]}</b><span>${o.t}</span></button>`).join("")}</div><div class="qfb" style="margin-top:12px"></div>`;
  const fb = $(".qfb", box), btns = $$(".opt", box);
  btns.forEach(b => b.onclick = () => {
    if (done) return;
    const o = list[+b.dataset.i];
    if (o.ok) {
      done = true; b.classList.add("right"); btns.forEach(x => { if (x !== b) { x.disabled = true; x.classList.add("dim"); } });
      const pts = tries === 0 ? 20 : 10; addScore(pts, tries === 0); sparkle(tries === 0 ? "정답!" : "통과!");
      fb.innerHTML = fbBox("good", `⭕ 정답! +${pts}점`, o.why);
      onDone(pts, fb);
    } else {
      tries++; b.classList.add("wrong"); b.disabled = true; crisis(); onWrong && onWrong(o);
      if (tries >= 2) {
        done = true; const ans = list.find(x => x.ok);
        btns.forEach(x => x.disabled = true);
        btns[list.indexOf(ans)].classList.add("right");
        fb.innerHTML = fbBox("bad", "❌ 아쉬워요", o.why) + `<div style="height:10px"></div>` + fbBox("", "💡 정답 공개", `「${ans.t}」<br>${ans.why}`);
        onDone(0, fb);
      } else {
        fb.innerHTML = fbBox("bad", "❌ 땡!", o.why + `<p class="hint">한 번 더 골라 보세요! (두 번째 정답 +10점)</p>`);
      }
    }
  });
}

/* ===== 랭킹 모듈 ===== */
const params = new URLSearchParams(location.search);
const today = (() => { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`; })();
const ROOM = ((params.get("room") || today).replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 40)) || today;
let DEVICE = store("gjb-device");
if (!DEVICE) { DEVICE = "d" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store("gjb-device", DEVICE); }
function joinUrl() { const u = new URL(location.href); u.hash = ""; u.search = ""; u.searchParams.set("room", ROOM); return u.toString(); }
function normName(n) { return String(n).replace(/\s+/g, " ").trim().toLowerCase(); }
function withTimeout(p, ms) { return Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]); }
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); setTimeout(() => rej(new Error("timeout")), 10000); });
}
const Rank = {
  mode: "local", ready: null, list: [], listeners: new Set(), col: null, fv: null, uid: null,
  init() {
    if (this.ready) return this.ready;
    this.ready = (async () => {
      // 1) claude.ai 아티팩트
      if (window.claude && typeof window.claude.use === "function") {
        try {
          const db = await withTimeout(window.claude.use("db"), 10000);
          const user = db ? await withTimeout(window.claude.use("user"), 5000) : null;
          const uid = user ? await withTimeout(user.id(), 5000) : null;
          if (db && uid) {
            this.uid = uid; this.col = db.collection("scores"); this.mode = "claude";
            const unsub = this.col.orderBy("score", "desc").limit(300).onSnapshot(snap => {
              this.list = snap.docs.map(d => { const x = d.data() || {}; return { id: d.id, name: String(x.name || "익명").slice(0, 12), score: +x.score || 0, first: +x.first || 0, at: +x.at || 0 }; });
              this.emit();
            }, err => { console.warn("랭킹 연결 오류", err); this.mode = "error"; this.emit(); });
            this.unsub = unsub;
            return;
          }
        } catch (e) { console.warn("공유 랭킹을 열지 못했어요", e); }
      }
      // 2) Firebase
      if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) {
        try {
          await loadScript(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app-compat.js`);
          await loadScript(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore-compat.js`);
          if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
          const fs = firebase.firestore();
          this.fv = firebase.firestore.FieldValue;
          this.col = fs.collection("birth_rooms").doc(ROOM).collection("scores");
          this.mode = "firebase";
          this.col.orderBy("score", "desc").limit(300).onSnapshot(snap => {
            this.list = snap.docs.map(d => { const x = d.data(); return { id: d.id, name: String(x.name || "익명").slice(0, 12), score: +x.score || 0, first: +x.first || 0, at: x.at && x.at.toMillis ? x.at.toMillis() : Date.now() }; });
            this.emit();
          }, err => { console.warn("랭킹 연결 오류", err); this.mode = "error"; this.emit(); });
          return;
        } catch (e) { console.warn("Firebase를 불러오지 못했어요", e); }
      }
      // 3) 이 기기 기록
      this.loadLocal();
    })();
    return this.ready;
  },
  me() { return this.mode === "claude" ? this.uid : DEVICE; },
  key() { return "gjb-rank-v1-" + ROOM; },
  loadLocal() { this.mode = "local"; try { this.list = JSON.parse(store(this.key()) || "[]"); } catch (e) { this.list = []; } this.emit(); },
  sorted() { return this.list.slice().sort((a, b) => b.score - a.score || a.at - b.at); },
  emit() { this.listeners.forEach(f => f()); },
  on(f) { this.listeners.add(f); f(); return () => this.listeners.delete(f); },
  // 닉네임 선점: 다른 사람이 이미 쓰고 있으면 false
  async claim(name) {
    await this.init();
    const key = normName(name);
    if (this.mode === "claude") return !this.list.some(r => normName(r.name) === key && r.id !== this.uid);
    if (this.mode === "firebase") {
      const ref = this.col.parent.collection("names").doc("n_" + encodeURIComponent(key));
      const d = await ref.get();
      if (d.exists) return d.data().device === DEVICE;
      try { await ref.set({ device: DEVICE, at: this.fv.serverTimestamp() }); return true; }
      catch (e) { const d2 = await ref.get(); return d2.exists && d2.data().device === DEVICE; }
    }
    if (this.mode === "local") return !this.list.some(r => normName(r.name) === key);
    return true;
  },
  // 같은 사람(기기)은 최고 점수만 남아요
  async submit(e) {
    await this.init();
    if (this.mode === "claude" || this.mode === "firebase") {
      const id = this.me();
      const ref = this.col.doc(id);
      const old = await ref.get();
      const prev = old.exists ? (+(old.data() || {}).score || 0) : -1;
      if (prev >= e.score) return { id, kept: true, best: prev };
      const row = { name: e.name, score: e.score, first: e.first, grade: gradeOf(e.score).name };
      row.at = this.mode === "claude" ? Date.now() : this.fv.serverTimestamp();
      await ref.set(row);
      return { id };
    }
    const id = DEVICE + "-" + Date.now().toString(36);
    this.list.push({ id, name: e.name, score: e.score, first: e.first, at: Date.now() });
    store(this.key(), JSON.stringify(this.list.slice(-200)));
    this.emit();
    return { id };
  }
};

      coach: "금쪽이도 아직 완벽하지 않아요. 한계를 알고, 함께 고민할 점을 지키면서 키워 가요.",
      next: stage7
    });
  }
}

/* ===== 7단계: 총정리 O/X (발표 자료 퀴즈) ===== */
const FINAL_OX = [
  { q: "<b>자기 조직화</b>란 세포가 스스로 배열돼 조직을 이루는 현상을 뜻한다.", a: true, why: "맞아요! 세포가 스스로 배열돼 조직을 이루는 현상을 <b>자기 조직화</b>라고 해요." },
  { q: "오가노이드는 <b>실제 장기의 모든 기능</b>을 갖춘다.", a: false, why: "아니에요. 오가노이드는 장기의 <b>일부 특징</b>만 재현해요. <b>완벽한 장기기능 구현</b>은 아직 어려운 한계예요." }
];
function stage7() {
  S.stage = 7;
  let i = 0;
  next();
  function next() {
    if (i >= FINAL_OX.length) return ending();
    const q = FINAL_OX[i++];
    const label = i === FINAL_OX.length ? "🎬 엔딩 보기 →" : "다음 문제 →";
    render(`${head("졸업 시험")}
      <div class="tvsub">총정리 퀴즈 <em>Q${i}</em></div>
      <div class="gain" style="font-size:1.05rem">O/X · 맞히면 10점 (기회 1번)</div>
      <div class="ox-q">${q.q}</div>
      <div class="ox"><button class="o" data-a="1" aria-label="O, 맞다">O</button><button class="x" data-a="0" aria-label="X, 아니다">X</button></div>
      <div id="fb"></div>`);
    $$(".ox button").forEach(b => b.onclick = () => {
      $$(".ox button").forEach(x => x.disabled = true);
      const ok = (b.dataset.a === "1") === q.a;
      $$(".ox button").find(x => (x.dataset.a === "1") === q.a).classList.add("right");
      if (ok) { addScore(10, true); sparkle("정답!"); }
      else { b.classList.add("wrong"); crisis(); }
      $("#fb").innerHTML = fbBox(ok ? "good" : "bad", ok ? "⭕ 정답! +10점" : `❌ 정답은 ${q.a ? "O" : "X"}`, q.why);
      addNext($("#fb"), next, label);
    });
  }
}

/* ===== 엔딩 영상 ===== */
function ending() {
  S.stage = 8; S.level = 3;
  const scenes = [
    { v: vv(ele("happy", "lv3 bouncy", "font-size:8px")), c: "금쪽이 = <b>살아 있는 세포</b>로 만든 <b>3차원 조직</b><small>장기의 일부 특징을 재현해요</small>" },
    { v: vv("🧫", "➡️", "📡", "➡️", "✨"), c: "줄기세포 → 유도 신호 → 오가노이드<small>금쪽이는 이렇게 태어났어요</small>" },
    { v: vv("📦", "🧫", "📡"), c: "배양 환경 3요소<small>3D 배양 · 줄기세포 · 성장인자</small>" },
    { v: vv("🐰", "🩺", "💊"), c: "금쪽이가 필요한 이유<small>동물실험의 대안 · 정밀의료 및 환자 맞춤형 치료 · 신약 개발 기간 및 비용 단축</small>" },
    { v: vv("🧠", "🦠", "🚀"), c: "금쪽이의 활용 분야<small>생물학적 컴퓨터 개발 · 헬리코박터균 위 질환 연구 · 우주병 치료제 개발</small>" },
    { v: vv("🔬", "✨"), c: "앞으로의 금쪽이<small>더 정교한 조직 모델 · 장기 간 상호작용 연구 · 맞춤형 의학의 발전</small>" }
  ];
  let i = 0;
  render(`${head("졸업")}
    <div class="tv"><div class="tv-top"><span>금쪽이 성장 영상</span><span class="r">● PLAY</span></div>
      <div class="screen" id="scr"></div><div class="bar"><i id="pbar"></i></div></div>
    <button class="btn ghost" id="skip">건너뛰기 ⏭</button>`);
  const show = () => {
    if (i >= scenes.length) return finale();
    const s = scenes[i++];
    $("#scr").innerHTML = `<div class="scene"><div class="vis">${s.v}</div><div class="cap">${s.c}</div></div>`;
    $("#pbar").style.width = (i / scenes.length * 100) + "%";
  };
  show();
  every(show, 3000);
  $("#scr").onclick = show;
  $("#skip").onclick = finale;
}
function finale() {
  S.stage = 8;
  render(`${head("졸업")}
    <div class="tvsub big">다 큰 <em>금쪽이</em></div>
    ${stageBox(ele("happy", "lv3 bouncy wave", "font-size:14px"))}
    ${expert("다 컸네요, 금쪽이. 정말 수고 많으셨어요!")}
    <div class="three">
      <h3>📌 오가노이드의 배양 환경 3요소</h3>
      <div class="eq"><span>📦<b>3D 배양</b></span>+<span>🧫<b>줄기세포</b></span>+<span>📡<b>성장인자</b></span></div>
      <p>줄기세포 → 유도 신호 → 오가노이드</p>
    </div>
    <div class="quote">“금쪽같은 내 세포,<br>이제 <em>어디에 쓰는지</em> 아시겠죠?”</div>
    <button class="btn yellow" id="toRes">📜 육아 성적표 받기</button>`);
  sparkle("졸업!");
  $("#toRes").onclick = resultScreen;
}

/* ===== 결과(성적표) ===== */
function resultScreen() {
  const g = gradeOf(S.score);
  const ladder = GRADES.slice().reverse().map(x => `<div class="${x === g ? "on" : ""}">${x.emoji}<br>${x.name}</div>`).join("");
  const rows = Object.keys(MAX).map(k => `<tr><td>${k}단계 · ${STAGES[k].name}</td><td>${S.pts[k] || 0} / ${MAX[k]}</td></tr>`).join("");
  render(`<div class="steplabel">육아 성적표</div>
    <div class="cert">
      <div class="t">초보 연구원 부모 육아 성적표</div>
      <div class="nm">${esc(S.name)} 님</div>
      <div class="pts">${S.score}<small> / ${MAX_SCORE}점</small></div>
      <div class="grade-emoji">${g.emoji}</div>
      <div class="grade">${g.name}</div>
      <p>${g.msg}</p>
      <div class="ladder">${ladder}</div>
      <div class="stats">첫 시도 성공 ${S.first}번</div>
    </div>
    <table class="brk">${rows}</table>
    <div class="rank-status" id="rstat">랭킹에 등록하는 중…</div>
    <button class="btn yellow" id="toRank">🏆 랭킹판 보기</button>
    <button class="btn coral" id="toEnd">🎬 육아 마치기</button>`);
  sparkle();
  $("#toRank").onclick = () => rankingScreen("result");
  $("#toEnd").onclick = endScreen;
  const paint = () => {
    const el = $("#rstat"); if (!el || !S.myId) return;
    const list = Rank.sorted();
    const i = list.findIndex(r => r.id === S.myId);
    const where = Rank.mode === "local" ? "이 기기" : "전체";
    el.innerHTML = i >= 0
      ? `${where} 랭킹 <b>${i + 1}위</b> / ${list.length}명${S.kept ? `<br><small>이전 최고 기록 ${S.kept}점이 유지돼요.</small>` : ""}`
      : `랭킹 등록 완료!`;
  };
  S.cleanups.push(Rank.on(paint));
  if (!S.submitted) {
    S.submitted = true;
    Rank.submit({ name: S.name, score: S.score, first: S.first })
      .then(r => { S.myId = r.id; S.kept = r.kept ? r.best : 0; paint(); })
      .catch(err => {
        console.warn(err); S.submitted = false;
        const el = $("#rstat");
        if (el) el.innerHTML = `랭킹 등록에 실패했어요. 인터넷 연결을 확인하고 <button class="btn ghost" id="retry" style="margin-top:8px">다시 등록</button>`;
        const rb = $("#retry"); if (rb) rb.onclick = resultScreen;
      });
  } else paint();
}

/* ===== 랭킹판 ===== */
function rankingHtml(list, myId, limit) {
  const top = list.slice(0, 3);
  const pod = (r, n) => r
    ? `<div class="pod p${n}">${ele("happy", "lv3 " + (n === 1 ? "bouncy" : ""))}<div class="nm">${esc(r.name)}</div><div class="sc">${r.score}점</div><div class="block">${n}</div></div>`
    : `<div class="pod p${n} empty">${ele("meh", "lv1")}<div class="nm">비어 있어요</div><div class="sc">-</div><div class="block">${n}</div></div>`;
  const rest = list.slice(3, limit);
  const rows = rest.map((r, i) => `<li class="${r.id === myId ? "me" : ""}"><span class="no">${i + 4}</span><span class="who2">${esc(r.name)}${r.id === myId ? "<small>(나)</small>" : ""}</span><span class="pt">${r.score}</span></li>`).join("");
  const me = myId ? list.findIndex(r => r.id === myId) : -1;
  const meRow = me >= limit ? `<li class="me"><span class="no">${me + 1}</span><span class="who2">${esc(list[me].name)}<small>(나)</small></span><span class="pt">${list[me].score}</span></li>` : "";
  return `<div class="podium">${pod(top[1], 2)}${pod(top[0], 1)}${pod(top[2], 3)}</div><div class="podium-base"></div>
    ${list.length === 0 ? `<div class="rlist"><div class="rempty">아직 기록이 없어요.<br>첫 번째 세포 육아 마스터가 되어 보세요!</div></div>`
      : (rows || meRow) ? `<ol class="rlist">${rows}${meRow}</ol>` : ""}`;
}
function liveBadge() {
  if (Rank.mode === "claude") return `<span class="live"><i></i>실시간 공유 랭킹</span>`;
  if (Rank.mode === "firebase") return `<span class="live"><i></i>실시간 · ${esc(ROOM)}</span>`;
  if (Rank.mode === "error") return `<span class="live local"><i></i>연결 오류</span>`;
  return `<span class="live local"><i></i>이 기기 기록</span>`;
}
function rankNote() {
  return Rank.mode === "claude" || Rank.mode === "firebase" ? `참가자 ${Rank.list.length}명 · 한 사람당 최고 점수만 남아요.`
    : Rank.mode === "error" ? "랭킹 서버에 연결하지 못했어요. 잠시 뒤 다시 열어 주세요."
    : "공유 랭킹에 연결되지 않아 이 기기에서 한 기록만 보여요.";
}
function rankingScreen(from) {
  render(`<div class="rank-head"><h2>🏆 명예의 전당</h2><span id="badge">${liveBadge()}</span></div>
    <div id="rbody"><div class="rlist"><div class="rempty">랭킹을 불러오는 중…</div></div></div>
    <div class="rnote" id="rnote"></div>
    ${from === "start"
      ? `<button class="btn" id="back">육아 시작하러 가기</button>`
      : `<button class="btn coral" id="end">🎬 육아 마치기</button><button class="btn ghost" id="back">성적표로 돌아가기</button>`}`);
  Rank.init().then(() => {
    S.cleanups.push(Rank.on(() => {
      const body = $("#rbody"); if (!body) return;
      body.innerHTML = rankingHtml(Rank.sorted(), S.myId, 50);
      $("#badge").innerHTML = liveBadge();
      $("#rnote").textContent = rankNote();
    }));
  });
  $("#back").onclick = from === "start" ? startScreen : resultScreen;
  const end = $("#end"); if (end) end.onclick = endScreen;
}

/* ===== 마지막 화면(크레딧) ===== */

  const g = gradeOf(S.score);
  const credits = [
    ["오늘의 초보 연구원 부모", `${esc(S.name)} (${g.name})`],
    ["출연", "금쪽이(오가노이드) · 초보 연구원 부모 · 세포 육아 전문가"],
    ["특별 출연", "줄기세포 · 유도 신호 · 3D 배양 · 성장인자"],
    ["오늘 배운 것", "정의 · 생성 과정 · 3요소 · 필요성 · 활용 분야 · 한계 · 윤리"],
    ["다음 회 예고", "우리 금쪽이가 “우리” 금쪽이가 아니라고요!?"]
  ].map(([a, b]) => `<div><small>${a}</small><b>${b}</b></div>`).join("");
  render(`<div class="end screen-in" style="flex:1">
    ${logo("small")}
    ${ele("happy", "lv3 wave bouncy")}
    <div class="sub big">금쪽이 육아를 모두 마쳤어요!</div>
    <div class="credits"><div class="roll">${credits}</div></div>
    <div class="quote">“금쪽같은 내 세포,<br>이제 <em>어디에 쓰는지</em> 아시겠죠?”</div>
    <div class="btn-row"><button class="btn ghost" id="rank2">🏆 랭킹 보기</button><button class="btn ghost" id="again">🔁 다시 하기</button></div>
    <div class="disclaimer">이 게임은 TV 육아 상담 예능을 패러디한 교육용 게임이에요.<br>실제 방송·출연자와는 관계가 없어요.</div>
  </div>`);
  sparkle();
  $("#rank2").onclick = () => rankingScreen("result");
  $("#again").onclick = startScreen;
}

/* ===== 진행자용 랭킹판 (주소 끝에 #board) ===== */
function boardScreen() {
  render(`<div class="board">
      <div class="left">
        ${logo()}
        <div class="sub cyan">QR을 찍고 참여하세요!</div>
        <div class="qr" id="qr"><div style="width:220px;padding:20px;text-align:center">QR 준비 중…</div></div>
        <div class="url" id="url"></div>
        <div class="count" id="count">참가자 0명</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div class="rank-head"><h2>🏆 실시간 랭킹</h2><span id="badge">${liveBadge()}</span></div>
        <div id="rbody"></div>
        <div class="rnote" id="rnote"></div>
      </div>
    </div>`, true);
  Rank.init().then(() => {
    const box = $("#qr"), url = $("#url"); if (!box) return;
    if (Rank.mode === "claude") {
      // 아티팩트 안에서는 페이지 주소를 알 수 없어요: 공유 링크를 안내해요
      box.innerHTML = `<div style="width:220px;padding:20px;text-align:center;line-height:1.6">이 페이지의<br><b>공유 링크</b>를<br>학생들에게 보내 주세요.</div>`;
      url.textContent = "공유(Share) 메뉴 → 링크 복사";
    } else {
      url.textContent = joinUrl();
      const draw = () => { box.innerHTML = ""; new QRCode(box, { text: joinUrl(), width: 220, height: 220, colorDark: "#1f3550", colorLight: "#ffffff" }); };
      if (window.QRCode) draw();
      else window.addEventListener("load", () => { if (window.QRCode) draw(); else box.innerHTML = `<div style="width:220px;padding:20px;text-align:center">QR을 불러오지 못했어요.<br>아래 주소로 접속해 주세요.</div>`; }, { once: true });
    }
    S.cleanups.push(Rank.on(() => {
      const body = $("#rbody"); if (!body) return;
      body.innerHTML = rankingHtml(Rank.sorted(), null, 30);
      $("#badge").innerHTML = liveBadge();
      $("#count").textContent = `참가자 ${Rank.list.length}명`;
      $("#rnote").textContent = Rank.mode === "local" ? "공유 랭킹에 연결되지 않아 이 기기 기록만 보여요." : "점수가 들어오면 자동으로 갱신돼요.";
    }));
  });
}

/* ===== 시작 ===== */
S.name = store("gjb-name") || "";
if (location.hash === "#board") boardScreen(); else loadingScreen();
window.addEventListener("hashchange", () => { if (location.hash === "#board") boardScreen(); });
</script>
