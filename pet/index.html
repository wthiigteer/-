<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원숭이 잠옷 아기호랑이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="desktop/core/pet.css">
<style>
/* VOICE  tender, doodle-sticker playful
   IDEA   a sheet of hand-drawn stickers where a baby white tiger lives
   PICTURE the pet itself, line-drawn, roaming the whole sheet
   COLOUR paper white-pink ground, ink brown line, blush pink, banana yellow
   TYPE   Jua
   LAYOUT full-screen sheet; status sticker top-left, toy stickers along the bottom */
:root{color-scheme:light;--ink:#4a3b36;--paper:#fff8f5;--pink:#ffc2cc}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle,#ffe3e8 1.5px,transparent 2px) 0 0/34px 34px,var(--paper);color:var(--ink);font:17px/1.4 "Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
.hud{position:fixed;top:12px;left:12px;z-index:20;background:#fff;border:2.5px solid var(--ink);border-radius:22px 26px 20px 24px;padding:12px 16px;min-width:210px;transform:rotate(-1deg)}
.name{font-size:24px;display:flex;align-items:center;gap:8px}
.name button{font:inherit;font-size:14px;border:0;background:none;color:var(--ink);opacity:.6;cursor:pointer;padding:4px 6px;border-radius:10px}
.name button:hover{opacity:1;background:#ffe3e8}
.row{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:6px}
.row span:first-child{width:50px}
.meter{flex:1;height:12px;border-radius:8px;border:2px solid var(--ink);overflow:hidden;background:#fff}
.meter i{display:block;height:100%;width:30%;transition:width .3s}
#loveBar{background:#ff9fb2}
#heatBar{background:linear-gradient(90deg,#9fdcff,#ffe27a,#ff9a7a)}
.mood{font-size:14px;opacity:.75;margin-top:6px}
.toys{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(96vw,680px)}
.toys button{font:inherit;font-size:16px;min-height:46px;padding:0 16px;border-radius:24px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .1s}
.toys button:hover{background:#fff0f3;transform:translateY(-2px)}
.toys button:active{transform:translateY(3px);box-shadow:none}
.toys button:focus-visible,.name button:focus-visible{outline:3px solid #ff8fa3;outline-offset:2px}
.hint{position:fixed;right:14px;bottom:140px;font-size:14px;opacity:.6;z-index:19;text-align:right;pointer-events:none}
.pip{position:fixed;inset:0;z-index:45;display:none;place-items:center;background:rgba(74,59,54,.3);padding:16px}
.pip.open{display:grid}
.pip>div{background:#fff;border:2.5px solid var(--ink);border-radius:22px;padding:18px;width:min(100%,560px);display:grid;gap:12px}
.pip h2{margin:0;font-size:22px;font-weight:400}
.pip p{margin:0;font-size:15px;line-height:1.5}
.pip video{width:100%;border-radius:14px;border:2px solid var(--ink);background:#fff8f5}
.pip .row2{display:flex;flex-wrap:wrap;gap:8px}
.pip button{font:inherit;font-size:16px;min-height:44px;padding:0 14px;border-radius:22px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.pip button.on{background:#ffc2cc}
.pip .go{background:#ff8fab;color:#fff;border-color:#4a3b36}
.pip .msg{font-size:14px;opacity:.75;min-height:1.4em}
body.wall{background-size:cover!important;background-position:center!important}
body.compact .hud,body.compact .toys,body.compact .hint{display:none}
.menuBtn{display:none;position:fixed;right:10px;top:10px;z-index:30;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font-size:20px;cursor:pointer;opacity:.7}
body.compact .menuBtn{display:block}
@media(max-width:600px){.hud{min-width:0;width:calc(100vw - 24px);padding:10px 14px}.name{font-size:20px}.hint{display:none}.toys button{font-size:15px;padding:0 12px}}
</style>
</head>
<body>
<section class="hud" aria-label="펫 상태">
  <div class="name"><span id="petName">꼬미</span><button id="renameBtn" aria-label="이름 바꾸기">✏️ 이름</button></div>
  <div class="row"><span>좋아해</span><div class="meter"><i id="loveBar"></i></div></div>
  <div class="row"><span>더워</span><div class="meter"><i id="heatBar"></i></div></div>
  <div class="mood" id="mood">너를 따라다니는 중</div>
</section>
<nav class="toys" aria-label="놀아주기">
  <button id="bananaBtn">🍌 바나나 주기</button>
  <button id="sunBtn">☀️ 덥게</button>
  <button id="iceBtn">🧊 시원하게</button>
  <button id="onesieBtn">🐒 잠옷 벗기기</button>
  <button id="roarBtn">🐱 냐앙 해봐</button>
  <button id="switchBtn">🔄 캐릭터 바꾸기</button>
  <button id="pipBtn">📺 다른 앱 위에 띄우기</button>
  <button id="wallBtn">🖼️ 내 배경화면 넣기</button>
  <button id="miniBtn">🙈 메뉴 숨기기</button>
  <input type="file" id="wallFile" accept="image/*" hidden>
</nav>
<button class="menuBtn" id="menuBtn" aria-label="메뉴 보이기">☰</button>
<div class="hint">마우스를 움직이거나 화면을 누르면 따라와요 · 끌어서 옮길 수 있어요<br>누르면 좋아하고, 문지르면 쓰다듬기 (너무 콕콕 찌르면 울어요)</div>
<div class="pip" id="pip"><div>
  <h2>다른 앱 위에 띄우기</h2>
  <p>펫이 노는 영상을 작은 창(화면 속 화면)으로 띄워요. 띄운 다음 홈으로 나가도 다른 앱 위에 계속 떠 있어요. 창은 손가락으로 옮기고 크기도 바꿀 수 있어요.</p>
  <div class="row2" id="pipPick"><button data-v="angel">😇 천사</button><button data-v="nyang">🐱 냥이</button><button data-v="tiger">🐯 꼬미</button></div>
  <video id="pipVid" src="pip/angel.mp4" playsinline muted loop autoplay controls autopictureinpicture></video>
  <div class="row2"><button class="go" id="pipGo">📺 띄우기</button><button id="pipClose">닫기</button></div>
  <div class="msg" id="pipMsg">버튼이 안 되면 영상 아래 컨트롤의 화면 속 화면 버튼을 눌러보세요.</div>
</div></div>
<script src="desktop/core/pet.js"></script>
<script src="desktop/core/nyang.js"></script>
<script src="desktop/core/angel.js"></script>
<script>
{
const CH={nyang:NyangChar,angel:AngelChar,tiger:{}},ORDER=['nyang','angel','tiger'];
let ch='nyang';try{ch=localStorage.getItem('petChar')||'nyang'}catch(e){}if(!CH[ch])ch='nyang';
const a=TigerPet(Object.assign({margins:{top:120,bottom:70}},CH[ch],{onSwitch(){try{localStorage.setItem('petChar',ORDER[(ORDER.indexOf(ch)+1)%ORDER.length])}catch(e){}location.reload()}}));
document.getElementById('roarBtn').textContent=CH[ch].roarMenu||'🐯 어흥 해봐';
const on=(id,f)=>document.getElementById(id).onclick=f;
on('bananaBtn',a.banana);on('sunBtn',a.sun);on('iceBtn',a.ice);on('onesieBtn',a.onesie);on('renameBtn',a.rename);on('roarBtn',a.roar);on('switchBtn',a.switch);
on('pipBtn',()=>{pip.classList.add('open');vid.play().catch(()=>{})});
const pip=document.getElementById('pip'),vid=document.getElementById('pipVid'),msg=document.getElementById('pipMsg');
const pick=v=>{vid.src='pip/'+v+'.mp4';vid.play().catch(()=>{});document.querySelectorAll('#pipPick button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))};
document.querySelectorAll('#pipPick button').forEach(b=>b.onclick=()=>pick(b.dataset.v));
pick(ch);
on('pipClose',()=>pip.classList.remove('open'));
const setMini=v=>{document.body.classList.toggle('compact',v);a.margins(v?{top:10,bottom:10}:{top:120,bottom:70})};
if(innerWidth<520||innerHeight<520)setMini(true);
on('miniBtn',()=>setMini(true));on('menuBtn',()=>setMini(false));
const applyWall=u=>{if(!u)return;document.body.style.background=`url("${u}")`;document.body.classList.add('wall')};
try{applyWall(localStorage.getItem('petWall'))}catch(e){}
on('wallBtn',()=>document.getElementById('wallFile').click());
document.getElementById('wallFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const k=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.85);applyWall(u);try{localStorage.setItem('petWall',u)}catch(err){}URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)};
on('pipGo',async()=>{try{await vid.play()}catch(e){}
 try{if(vid.webkitSupportsPresentationMode&&vid.webkitSupportsPresentationMode('picture-in-picture')){vid.webkitSetPresentationMode('picture-in-picture');msg.textContent='떴어요! 이제 홈으로 나가도 계속 떠 있어요.';return}
  if(document.pictureInPictureEnabled){await vid.requestPictureInPicture();msg.textContent='떴어요! 이제 다른 앱으로 가도 계속 떠 있어요.';return}
  msg.textContent='여기서는 바로 띄울 수 없어요. 영상 컨트롤의 화면 속 화면 버튼을 눌러보세요.'}
 catch(e){msg.textContent='여기서는 바로 띄울 수 없어요. 영상 컨트롤의 화면 속 화면 버튼을 눌러보세요.'}});
}
</script>
</body>
</html>
